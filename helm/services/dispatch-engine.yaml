# dispatch-engine - per-service values for helm/homefix-service.
# Mirrors the service's entry in docker-compose.core.yml, minus dev-only settings
# (inline secrets, ddl-auto=update, debug logging, dev seeding/OTP echo).
# The port must equal the Dockerfile EXPOSE and compose SERVER_PORT.

serviceName: dispatch-engine
containerPort: 8087

dependencies:
  postgres: true
  redis: true
  kafka: true

# Keys read from the existing Secret "dispatch-engine-secrets". DB_* keys are added
# automatically by dependencies.postgres (db_host, db_port, db_name, db_username,
# db_password).
secrets:
  env:
    JWT_SECRET: jwt_secret
    INTERNAL_API_KEY: internal_api_key

config:
  PROVIDER_SERVICE_URL: "http://provider-service:8083"
  BOOKING_SERVICE_URL: "http://booking-service:8084"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8090"
  CUSTOMER_SERVICE_URL: "http://customer-service:8082"
  CATALOG_SERVICE_URL: "http://catalog-service:8085"
