# engagement-app - values for helm/jihajoor-service. One JVM hosting outbox-processor, notification-service, complaint-service, rating-review-service, admin-service, reporting-service,
# each on the port it has in docker-compose.core.yml (shared/jihajoor-service-host).
# Merged from the former per-service values; inter-service URLs point at the deployable.

serviceName: engagement-app
# outbox-processor
containerPort: 8099
extraPorts:
  - name: notification  # notification-service
    port: 8090
  - name: complaint  # complaint-service
    port: 8091
  - name: rating-review  # rating-review-service
    port: 8097
  - name: admin  # admin-service
    port: 8095
  - name: reporting  # reporting-service
    port: 8096

dependencies:
  postgres: true
  redis: true
  kafka: true

# Keys read from the existing Secret "engagement-app-secrets".
secrets:
  env:
    JWT_SECRET: jwt_secret
    INTERNAL_API_KEY: internal_api_key
    # Amazon SES SMTP credentials (IAM SMTP user), for NOTIFICATION_EMAIL_PROVIDER=smtp.
    SMTP_USERNAME: smtp_username
    SMTP_PASSWORD: smtp_password

config:
  PREFERENCE_SERVICE_URL: "http://identity-app:8082"
  AUTH_SERVICE_URL: "http://identity-app:8081"
  # Complaint refunds go to payment-service, review ratings to provider-service.
  PAYMENT_SERVICE_URL: "http://money-app:8088"
  PROVIDER_SERVICE_URL: "http://identity-app:8083"
  # Notification emails through Amazon SES SMTP; NOTIFICATION_EMAIL_FROM must be a verified
  # SES identity. SMTP_* only, never SPRING_MAIL_* (it would reach every service in this JVM).
  NOTIFICATION_EMAIL_PROVIDER: "smtp"
  NOTIFICATION_EMAIL_FROM: "Ji-Hajoor <no-reply@jihajoor.example>"  # TODO: your verified SES identity
  SMTP_HOST: "email-smtp.ap-south-1.amazonaws.com"
  SMTP_PORT: "587"
  SMTP_STARTTLS: "true"

# Kafka lag triggers, used when keda.enabled is set for the environment.
keda:
  triggers:
    # All thirteen lifecycle topics
    - consumerGroup: notification-service.lifecycle
    - consumerGroup: rating-review-service.payment-completed
      topic: PaymentCompleted
      lagThreshold: 200
