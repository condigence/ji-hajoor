# booking-service - per-service values for helm/homefix-service.
# Mirrors the service's entry in docker-compose.core.yml, minus dev-only settings
# (inline secrets, ddl-auto=update, debug logging, dev seeding/OTP echo).
# The port must equal the Dockerfile EXPOSE and compose SERVER_PORT.
#
# MEDIA_STORAGE_PROVIDER=local mirrors compose; no S3 adapter exists yet.

serviceName: booking-service
containerPort: 8084

dependencies:
  postgres: true
  redis: false
  # Consumes PaymentCompleted to move a paid booking to PAYMENT_COMPLETED.
  kafka: true

# Keys read from the existing Secret "booking-service-secrets". DB_* keys are added
# automatically by dependencies.postgres (db_host, db_port, db_name, db_username,
# db_password).
secrets:
  env:
    JWT_SECRET: jwt_secret
    INTERNAL_API_KEY: internal_api_key

config:
  CATALOG_CLIENT: "http"
  CATALOG_SERVICE_URL: "http://catalog-service:8085"
  PRICING_CLIENT: "http"
  PRICING_ENGINE_URL: "http://pricing-engine:8086"
  CUSTOMER_CLIENT: "http"
  CUSTOMER_SERVICE_URL: "http://customer-service:8082"
  PROVIDER_SERVICE_URL: "http://provider-service:8083"
  TENANT_ASSIGNMENT_TIMEOUT: "PT60M"
  MEDIA_STORAGE_PROVIDER: "local"
