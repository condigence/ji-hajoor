# payment-service - per-service values for helm/homefix-service.
# Mirrors the service's entry in docker-compose.core.yml, minus dev-only settings
# (inline secrets, ddl-auto=update, debug logging, dev seeding/OTP echo).
# The port must equal the Dockerfile EXPOSE and compose SERVER_PORT.

serviceName: payment-service
containerPort: 8088

dependencies:
  postgres: true
  redis: true
  kafka: false

# Keys read from the existing Secret "payment-service-secrets". DB_* keys are added
# automatically by dependencies.postgres (db_host, db_port, db_name, db_username,
# db_password).
secrets:
  env:
    JWT_SECRET: jwt_secret
    KMS_DATA_KEY: kms_data_key
    RAZORPAY_KEY_ID: razorpay_key_id
    RAZORPAY_KEY_SECRET: razorpay_key_secret
    RAZORPAY_WEBHOOK_SECRET: razorpay_webhook_secret
    STRIPE_WEBHOOK_SECRET: stripe_webhook_secret
    # Presented to the Booking Service's internal payment endpoints.
    INTERNAL_API_KEY: internal_api_key

# The payment simulator (PAYMENT_SIMULATOR_ENABLED) is a local-only aid and is never set here.
config:
  BOOKING_SERVICE_URL: "http://booking-service:8084"
  PROVIDER_WALLET_CLIENT: "http"
  PROVIDER_SERVICE_URL: "http://provider-service:8083"
