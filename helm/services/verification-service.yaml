# verification-service - per-service values for helm/homefix-service.
# Mirrors the service's entry in docker-compose.core.yml, minus dev-only settings
# (inline secrets, ddl-auto=update, debug logging, dev seeding/OTP echo).
# The port must equal the Dockerfile EXPOSE and compose SERVER_PORT.

serviceName: verification-service
containerPort: 8094

dependencies:
  postgres: true
  redis: false
  kafka: false

# Keys read from the existing Secret "verification-service-secrets". DB_* keys are added
# automatically by dependencies.postgres (db_host, db_port, db_name, db_username,
# db_password).
secrets:
  env:
    JWT_SECRET: jwt_secret
    # Required on /internal/** (the Provider Service's batch lookups and admin suspend/reinstate),
    # and presented to the Provider Service for the admin verification queue's provider names.
    INTERNAL_API_KEY: internal_api_key

config:
  PROVIDER_SERVICE_URL: "http://provider-service:8083"
