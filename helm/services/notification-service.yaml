# notification-service - per-service values for helm/homefix-service.
# Mirrors the service's entry in docker-compose.core.yml, minus dev-only settings
# (inline secrets, ddl-auto=update, debug logging, dev seeding/OTP echo).
# The port must equal the Dockerfile EXPOSE and compose SERVER_PORT.
#
# SMS/email/push providers stay at their defaults (log): no real gateways exist yet.

serviceName: notification-service
containerPort: 8090

dependencies:
  postgres: true
  redis: false
  kafka: true

# Keys read from the existing Secret "notification-service-secrets". DB_* keys are added
# automatically by dependencies.postgres (db_host, db_port, db_name, db_username,
# db_password).
secrets:
  env:
    JWT_SECRET: jwt_secret
    INTERNAL_API_KEY: internal_api_key

config:
  PREFERENCE_SERVICE_URL: "http://customer-service:8082"
  AUTH_SERVICE_URL: "http://auth-service:8081"
