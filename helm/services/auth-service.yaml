# auth-service - per-service values for helm/homefix-service.
# Mirrors the service's entry in docker-compose.core.yml, minus dev-only settings
# (inline secrets, ddl-auto=update, debug logging, dev seeding/OTP echo).
# The port must equal the Dockerfile EXPOSE and compose SERVER_PORT.
#
# GOOGLE_CLIENT_ID / APPLE_SERVICES_ID have no default in application.yml, so they
# must be present; empty disables that social login (same as compose). Set the real
# client ids per environment in values-<env>.yaml or with --set.
# SMS_PROVIDER is left at its default (log): no real SMS gateway exists yet.

serviceName: auth-service
containerPort: 8081

dependencies:
  postgres: true
  redis: true
  kafka: false

# Keys read from the existing Secret "auth-service-secrets". DB_* keys are added
# automatically by dependencies.postgres (db_host, db_port, db_name, db_username,
# db_password).
secrets:
  env:
    JWT_SECRET: jwt_secret
    INTERNAL_API_KEY: internal_api_key

config:
  GOOGLE_CLIENT_ID: ""
  APPLE_SERVICES_ID: ""
