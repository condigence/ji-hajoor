# provider-service - per-service values for helm/homefix-service.
# Mirrors the service's entry in docker-compose.core.yml, minus dev-only settings
# (inline secrets, ddl-auto=update, debug logging, dev seeding/OTP echo).
# The port must equal the Dockerfile EXPOSE and compose SERVER_PORT.

serviceName: provider-service
containerPort: 8083

dependencies:
  postgres: true
  redis: false
  kafka: false

# Keys read from the existing Secret "provider-service-secrets". DB_* keys are added
# automatically by dependencies.postgres (db_host, db_port, db_name, db_username,
# db_password).
secrets:
  env:
    JWT_SECRET: jwt_secret
    KMS_DATA_KEY: kms_data_key
    INTERNAL_API_KEY: internal_api_key

config:
  BOOKING_CLIENT: "http"
  BOOKING_SERVICE_URI: "http://booking-service:8084"
  CATALOG_SERVICE_URI: "http://catalog-service:8085"
  # Batch APPROVED lookup behind the dispatch eligibility search (Req 5.10, 8.2).
  VERIFICATION_SERVICE_URL: "http://verification-service:8094"
  # Account lookup and TENANT_ADMIN grants for Tenant administration (Requirement MT-2).
  AUTH_SERVICE_URL: "http://auth-service:8081"
