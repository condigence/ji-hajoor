# Default values for the shared jihajoor-service chart.
#
# One chart, one release per Spring Boot service. A release is rendered from three
# layers, most specific last:
#
#   values.yaml                       (this file: chart defaults)
#   values-<environment>.yaml         (staging | production sizing)
#   ../services/<service>.yaml        (port, dependencies, config, secret wiring)
#
# plus the per-deploy values the pipeline passes with --set:
#   image.repository, image.tag, platform.redis.host, platform.redis.port,
#   platform.kafka.bootstrapServers
#
# Example (what .github/workflows/deploy-services.yml runs):
#   helm upgrade --install jihajoor-booking-service helm/jihajoor-service \
#     -n <namespace> \
#     -f helm/jihajoor-service/values-staging.yaml \
#     -f helm/services/booking-service.yaml \
#     --set image.repository=<registry>/booking-service --set image.tag=<git sha>

# ── Identity ────────────────────────────────────────────────────────────────
# Required, set by helm/services/<deployable>.yaml. Every resource (Deployment,
# Service, ServiceAccount, ...) is named after it, so in-cluster DNS matches
# docker-compose.core.yml (identity-app:8081, jobs-app:8084, ...) and the
# services' URL settings work unchanged. The ServiceAccount name also
# matches the IRSA role subjects in infra/terraform/modules/iam.
serviceName: ""
nameOverride: ""
fullnameOverride: ""

# Required, set by values-<environment>.yaml: staging | production.
environment: ""

# Required, set by helm/services/<service>.yaml. The port the service listens on.
# Injected as SERVER_PORT, and used by the container port, the Service, the probes
# and the Prometheus annotations. Must equal the Dockerfile EXPOSE and the
# SERVER_PORT in docker-compose.core.yml (CI checks the Dockerfile).
containerPort: null

# Further ports, for a deployable that hosts several services in one JVM: one entry per
# additional service, exposed on the container and on the Service under its name (at most 15
# lowercase characters). The probes and Prometheus annotations stay on containerPort.
#   - name: customer
#     port: 8082
extraPorts: []

replicaCount: 2

image:
  # Both required; passed by the pipeline (<registry>/<service>, <git sha>).
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  # IRSA role ARN goes here per deployable/environment (Terraform output irsa_role_arns), e.g.
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<prefix>-irsa-<deployable>
  annotations: {}
  # Defaults to the service name.
  name: ""
  # The services never call the Kubernetes API.
  automountToken: false

# ── Platform dependencies ───────────────────────────────────────────────────
# Which shared infrastructure the service needs. Set per service.
dependencies:
  # Adds DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD from the service Secret
  # (keys db_host, db_port, db_name, db_username, db_password — the same keys as the
  # Secrets Manager shells in infra/terraform/modules/secrets_manager) and builds
  # DB_URL=jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME) from them.
  postgres: false
  # Adds REDIS_HOST / REDIS_PORT from platform.redis (required when true).
  redis: false
  # Adds KAFKA_BOOTSTRAP_SERVERS from platform.kafka (required when true).
  kafka: false

# Per-environment endpoints of the shared infrastructure. Not secrets; passed by
# the deploy workflow from GitHub environment variables. Rendering fails if a
# service declares a dependency whose endpoint is empty.
platform:
  redis:
    host: ""
    port: 6379
  kafka:
    bootstrapServers: ""

# ── Secrets ─────────────────────────────────────────────────────────────────
# The chart never creates or contains secret values. Each service reads from ONE
# existing Secret in the release namespace (default "<serviceName>-secrets"),
# created out of band — e.g. by External Secrets Operator from the
# "<project>-<env>/<service>" entry in AWS Secrets Manager. Missing keys make the
# pod fail to start (secretKeyRef is not optional).
secrets:
  name: ""
  # ENV_VAR_NAME: secret-key, set per service.
  env: {}

# ── Configuration ───────────────────────────────────────────────────────────
# Non-secret environment, rendered into a ConfigMap and loaded with envFrom.
# Merged across the three values layers.
config: {}

# Extra env entries appended verbatim (e.g. additional valueFrom refs).
extraEnv: []

podAnnotations: {}
podLabels: {}

# Prometheus scrape annotations, rendered with the service's own port.
# Every service exposes Micrometer at /prometheus (management base-path "/").
metrics:
  prometheusAnnotations: true
  path: /prometheus

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Defaults to containerPort, so callers use the same host:port as in compose.
  port: null
  portName: http

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Horizontal Pod Autoscaler (rendered only when enabled).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Kafka consumer-lag autoscaling with KEDA. Rendered only when enabled AND the deployable
# lists triggers (helm/services/<deployable>.yaml); it then replaces the HPA above, because
# KEDA manages its own HPA for the Deployment and two HPAs on one Deployment fight. Needs the
# KEDA operator and a TriggerAuthentication in the release namespace
# (infra/k8s/observability/keda-kafka-trigger-auth.yaml).
keda:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  pollingInterval: 15
  cooldownPeriod: 180
  # Also scale on CPU, as the HPA would.
  cpuUtilization: 70
  # MSK bootstrap brokers (comma-separated). Required when enabled.
  bootstrapServers: ""
  triggerAuthentication: keda-kafka-trigger-auth
  # One kafka trigger per consumer group the deployable's services use. Omit `topic` to
  # measure the lag over every topic the group reads.
  #   - consumerGroup: dispatch-engine.booking-created
  #     topic: BookingCreated
  #     lagThreshold: 50
  triggers: []

# Spring Boot health groups. management.endpoints.web.base-path is "/" in every
# service and probes are enabled, so these live on the server port at
# /health/liveness and /health/readiness (the same paths the compose
# healthchecks use).
probes:
  liveness:
    path: /health/liveness
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/readiness
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # Gives a cold JVM up to ~3 minutes before liveness takes over.
  startup:
    path: /health/liveness
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 36

# readOnlyRootFilesystem is on, so /tmp (Tomcat work dir, multipart uploads)
# needs a writable emptyDir.
tmpVolumes:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}

# Spread replicas across zones for availability.
topologySpreadConstraints:
  enabled: true

# PodDisruptionBudget to keep replicas during voluntary disruptions.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
