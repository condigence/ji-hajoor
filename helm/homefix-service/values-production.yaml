# Production overrides for the shared homefix-service chart.
# Applied by .github/workflows/deploy-services.yml for environment=production,
# before helm/services/<service>.yaml.

environment: production

replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: "2"
    memory: 1536Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

config:
  # No application-<profile>.yml exists yet; set so profile-specific config can be
  # added without touching the chart.
  SPRING_PROFILES_ACTIVE: production

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  enabled: true
