name: Lint delivery config (reusable)

# Lints the workflows and the Helm chart, and checks that every service's port
# agrees across its Dockerfile, docker-compose.core.yml and its Helm values (per deployable).
# Called by ci.yml and pr-checks.yml.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run actionlint (with shellcheck)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" --workdir /repo \
            rhysd/actionlint:1.7.7 -color

  chart:
    name: Helm chart and service wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Every deployable has Helm values, and ports agree everywhere
        run: |
          # yq (mikefarah v4) is preinstalled on ubuntu-latest runners. A deployable is every
          # apps/<name> plus the API gateway; each hosted service has a port, and the set of ports
          # must be the same in the Helm values (containerPort + extraPorts), the Dockerfile's
          # EXPOSE and the container ports in docker-compose.core.yml.
          status=0
          mapfile -t deployables < <({ for d in apps/*/; do [ -f "${d}pom.xml" ] && basename "${d}"; done; echo api-gateway; })
          for d in "${deployables[@]}"; do
            if [ "${d}" = "api-gateway" ]; then dir="services/api-gateway/"; else dir="apps/${d}/"; fi
            values="helm/services/${d}.yaml"
            if [ ! -f "${values}" ]; then
              echo "::error::${d} has no ${values}; it cannot be deployed."
              status=1
              continue
            fi
            name=$(yq '.serviceName' "${values}")
            helm_ports=$({ yq '.containerPort' "${values}"; yq '.extraPorts[].port' "${values}"; } | sort -n | xargs)
            docker_ports=$(sed -n 's/^EXPOSE[[:space:]]\{1,\}\(.*\)$/\1/p' "${dir}Dockerfile" | tr ' ' '\n' | sed '/^$/d' | sort -n | xargs)
            compose_ports=$(yq ".services.\"${d}\".ports[]" docker-compose.core.yml | sed 's/.*://' | sort -n | xargs)
            echo "${d}: helm=[${helm_ports}] dockerfile=[${docker_ports}] compose=[${compose_ports}]"
            if [ "${name}" != "${d}" ]; then
              echo "::error file=${values}::serviceName is '${name}', expected '${d}'."
              status=1
            fi
            if [ "${helm_ports}" != "${docker_ports}" ] || [ "${helm_ports}" != "${compose_ports}" ]; then
              echo "::error file=${values}::Port mismatch for ${d}: helm [${helm_ports}], Dockerfile EXPOSE [${docker_ports}], compose [${compose_ports}]."
              status=1
            fi
          done
          for values in helm/services/*.yaml; do
            d=$(basename "${values}" .yaml)
            if [[ " ${deployables[*]} " != *" ${d} "* ]]; then
              echo "::error file=${values}::${d} is not a deployable (apps/<name> or api-gateway)."
              status=1
            fi
          done
          exit "${status}"

      - name: Lint and render the chart for every service and environment
        run: |
          # Throwaway values: they only satisfy the chart's required fields so it
          # can render; real ones come from the deploy workflow.
          cat > /tmp/lint-values.yaml <<'EOF'
          image:
            repository: lint.invalid/jihajoor
            tag: 0000000000000000000000000000000000000000
          platform:
            redis:
              host: redis.lint.invalid
            kafka:
              bootstrapServers: kafka-1.lint.invalid:9092,kafka-2.lint.invalid:9092
          EOF
          for env in staging production; do
            for values in helm/services/*.yaml; do
              svc=$(basename "${values}" .yaml)
              echo "::group::${env} / ${svc}"
              helm lint helm/jihajoor-service --strict \
                -f "helm/jihajoor-service/values-${env}.yaml" -f "${values}" -f /tmp/lint-values.yaml
              helm template "jihajoor-${svc}" helm/jihajoor-service --namespace "${env}" \
                -f "helm/jihajoor-service/values-${env}.yaml" -f "${values}" -f /tmp/lint-values.yaml \
                > "/tmp/${env}-${svc}.yaml"
              echo "::endgroup::"
            done
          done
          echo "Rendered $(find /tmp -maxdepth 1 -name '*-*.yaml' ! -name lint-values.yaml | wc -l) manifests."
