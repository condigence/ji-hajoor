name: Live check (temporary)
on:
  push:
    branches: ["railway/live-check"]
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the deployed site
        run: |
          U=https://ji-hajoor-production.up.railway.app
          H='Content-Type: application/json'
          curl -s -o /dev/null $U/
          curl -s -o /dev/null -H "$H" -d '{"mobileNumber":"+919000000077","role":"CUSTOMER"}' $U/api/auth/register/otp
          curl -s -o /dev/null -H "$H" -d '{"mobileNumber":"+919000000077","otp":"123456"}' $U/api/auth/register/verify
          curl -s -o /dev/null -H "$H" -d '{"mobileNumber":"+919999999999","role":"CUSTOMER"}' $U/api/auth/register/otp
          curl -s -o /dev/null -H "$H" -d '{"mobileNumber":"+919999999999","otp":"123456"}' $U/api/auth/register/verify
