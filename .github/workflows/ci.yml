name: CI — Build, Test, Image, Deploy to Staging

# On every push to main or release/**:
#   1. plan     — the real service list (every services/<name> with a pom.xml)
#   2. lint     — actionlint, Helm lint/render for every service, port agreement
#   3. build    — install shared/*, then per service: mvn verify (tests + jar),
#                 coverage floor, image from the service's own Dockerfile,
#                 Trivy scan, optional push to ECR; Pact contract drift check
#   4. staging  — optional Helm deploy of the pushed images to staging
#
# Steps 3 (push) and 4 are OFF until the infrastructure exists. Turn them on with
# repository/environment variables (Settings → Secrets and variables → Actions):
#
#   IMAGE_PUSH_ENABLED=true     push images to ECR. Also needs (repository vars):
#     ECR_REGISTRY              <account>.dkr.ecr.<region>.amazonaws.com
#     AWS_REGION                e.g. ap-south-1
#     AWS_CI_ROLE_ARN           IAM role trusted for this repo via GitHub OIDC,
#                               allowed to push to the ECR repositories
#   STAGING_DEPLOY_ENABLED=true deploy main to the "staging" GitHub environment.
#                               Its variables are listed in deploy-services.yml.
#   MIN_LINE_COVERAGE           JaCoCo line-coverage floor per service (default 80;
#                               0 disables the gate).
#
# No AWS access keys are used anywhere: credentials come from OIDC role
# assumption only.

on:
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - 'frontend/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated directory names under services/, or "all"'
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be mid-way through a staging deploy.
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.services.outputs.json }}
      push: ${{ steps.flags.outputs.push }}
      deploy: ${{ steps.flags.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve services
        id: services
        env:
          REQUESTED: ${{ github.event.inputs.services || 'all' }}
        run: |
          mapfile -t all < <(for d in services/*/; do [ -f "${d}pom.xml" ] && basename "${d}"; done)
          if [ "${#all[@]}" -eq 0 ]; then
            echo "::error::No services found under services/."
            exit 1
          fi
          if [ "${REQUESTED}" = "all" ]; then
            selected=("${all[@]}")
          else
            selected=()
            IFS=',' read -ra wanted <<< "${REQUESTED}"
            for w in "${wanted[@]}"; do
              w=$(echo "${w}" | xargs)
              [ -z "${w}" ] && continue
              if [ ! -f "services/${w}/pom.xml" ]; then
                echo "::error::Unknown service '${w}'. Known: ${all[*]}"
                exit 1
              fi
              selected+=("${w}")
            done
          fi
          json=$(printf '%s\n' "${selected[@]}" | sort -u | jq -R . | jq -cs .)
          echo "json=${json}" >> "$GITHUB_OUTPUT"
          echo "Services: ${json}"

      - name: Resolve push and deploy switches
        id: flags
        env:
          IMAGE_PUSH_ENABLED: ${{ vars.IMAGE_PUSH_ENABLED }}
          STAGING_DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
        run: |
          push=false; deploy=false
          [ "${IMAGE_PUSH_ENABLED}" = "true" ] && push=true
          if [ "${push}" = true ] && [ "${STAGING_DEPLOY_ENABLED}" = "true" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            deploy=true
          fi
          echo "push=${push}" >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          {
            echo "### Delivery switches"
            echo "- Image push to ECR: **${push}** (IMAGE_PUSH_ENABLED)"
            echo "- Staging deploy: **${deploy}** (STAGING_DEPLOY_ENABLED, main only, needs push)"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    uses: ./.github/workflows/lint-delivery.yml

  build:
    name: Build
    needs: [plan, lint]
    uses: ./.github/workflows/build-services.yml
    permissions:
      contents: read
      id-token: write
    with:
      services: ${{ needs.plan.outputs.services }}
      image-tag: ${{ github.sha }}
      min-line-coverage: ${{ fromJSON(vars.MIN_LINE_COVERAGE || '80') }}
      push-images: ${{ needs.plan.outputs.push == 'true' }}

  deploy-staging:
    name: Staging
    needs: [plan, build]
    if: needs.plan.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy-services.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging
      services: ${{ needs.plan.outputs.services }}
      image-tag: ${{ github.sha }}
