name: Railway smoke test

# Builds the exact images Railway builds (root Dockerfile per backend service,
# frontend/admin-portal/Dockerfile for the portal), runs them the way Railway
# does — PORT, DATABASE_URL and REDIS_URL injected, Redis behind a password —
# and signs in as the bootstrap admin through portal -> gateway -> auth-service.
# A green run means the Railway deployment of these three services can work.

on:
  push:
    branches: [main, "railway/**"]
    paths:
      - Dockerfile
      - deploy/**
      - shared/**
      - services/auth-service/**
      - services/api-gateway/**
      - frontend/admin-portal/**
      - .github/workflows/railway-smoke.yml
  pull_request:
    paths:
      - Dockerfile
      - deploy/**
      - shared/**
      - services/auth-service/**
      - services/api-gateway/**
      - frontend/admin-portal/**
      - .github/workflows/railway-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Portal -> gateway -> auth sign-in
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NET: jh
      ADMIN_USER: owner
      ADMIN_PASS: smoke-test-password-123
      ADMIN_MOBILE: '+919876543210'
    steps:
      - uses: actions/checkout@v4

      - name: Build images (as Railway does)
        run: |
          docker build -q --build-arg SERVICE=auth-service -t jh/auth-service .
          docker build -q --build-arg SERVICE=api-gateway  -t jh/api-gateway .
          docker build -q -t jh/admin-portal frontend/admin-portal

      - name: Start Postgres and password-protected Redis
        run: |
          docker network create "$NET"
          docker run -d --name postgres --network "$NET" \
            -e POSTGRES_PASSWORD='pg-p@ss/word' -e POSTGRES_DB=railway postgres:16-alpine
          docker run -d --name redis --network "$NET" redis:7-alpine \
            redis-server --requirepass redis-secret
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres -d railway >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Start auth-service, api-gateway, admin-portal
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          REDIS_URL='redis://default:redis-secret@redis:6379'
          # Password URL-encoded exactly as Railway's DATABASE_URL would carry it.
          docker run -d --name auth-service --network "$NET" \
            -e PORT=8081 \
            -e DATABASE_URL='postgresql://postgres:pg-p%40ss%2Fword@postgres:5432/railway' \
            -e REDIS_URL="$REDIS_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e BOOTSTRAP_ADMIN_USERNAME="$ADMIN_USER" \
            -e BOOTSTRAP_ADMIN_PASSWORD="$ADMIN_PASS" \
            -e BOOTSTRAP_ADMIN_MOBILE="$ADMIN_MOBILE" \
            jh/auth-service
          docker run -d --name api-gateway --network "$NET" \
            -e PORT=8080 \
            -e REDIS_URL="$REDIS_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e AUTH_SERVICE_URI=http://auth-service:8081 \
            -e AUTH_INTROSPECT_URI=http://auth-service:8081/auth/introspect \
            jh/api-gateway
          docker run -d --name admin-portal --network "$NET" -p 3000:3000 \
            -e PORT=3000 \
            -e API_GATEWAY_URL=http://api-gateway:8080 \
            jh/admin-portal

      - name: Wait for services to be healthy
        run: |
          wait_for() {
            for i in $(seq 1 90); do
              if docker run --rm --network "$NET" curlimages/curl:8.10.1 -fsS "$2" >/dev/null 2>&1; then
                echo "$1 is up"; return 0
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$1")" != "true" ]; then
                echo "::error::$1 exited"; docker logs "$1" | tail -80; return 1
              fi
              sleep 3
            done
            echo "::error::$1 not healthy in time"; docker logs "$1" | tail -80; return 1
          }
          wait_for auth-service http://auth-service:8081/health
          wait_for api-gateway  http://api-gateway:8080/health
          wait_for admin-portal http://admin-portal:3000/

      - name: Home page and gateway root answer
        run: |
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null -w 'portal /login -> %{http_code}\n' http://localhost:3000/login
          docker run --rm --network "$NET" curlimages/curl:8.10.1 -fsS -H 'X-Forwarded-Proto: https' \
            http://api-gateway:8080/ | tee /dev/stderr | grep -q '"UP"'

      - name: Sign in through the portal as the bootstrap admin
        run: |
          # Railway's edge terminates TLS and sends X-Forwarded-Proto: https.
          code=$(curl -sS -o login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-Proto: https' \
            -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASS\"}" \
            http://localhost:3000/api/auth/login/password)
          echo "login -> HTTP $code"; cat login.json; echo
          test "$code" = 200
          jq -e '.roles | index("SUPER_ADMIN")' login.json >/dev/null
          jq -r .accessToken login.json > token.txt

      - name: Wrong password is rejected
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-Proto: https' \
            -d "{\"username\":\"$ADMIN_USER\",\"password\":\"not-the-password\"}" \
            http://localhost:3000/api/auth/login/password)
          echo "bad login -> HTTP $code"; test "$code" = 401

      - name: Token works on a protected admin API (gateway introspection)
        run: |
          code=$(curl -sS -o users.json -w '%{http_code}' \
            -H "Authorization: Bearer $(cat token.txt)" -H 'X-Forwarded-Proto: https' \
            http://localhost:3000/api/admin/users)
          echo "GET /api/admin/users -> HTTP $code"; head -c 600 users.json; echo
          test "$code" = 200
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' \
            http://localhost:3000/api/admin/users)
          echo "without token -> HTTP $code"; test "$code" = 401

      - name: Restart keeps the admin and its password
        run: |
          docker restart auth-service
          for i in $(seq 1 60); do
            docker run --rm --network "$NET" curlimages/curl:8.10.1 -fsS http://auth-service:8081/health >/dev/null 2>&1 && break
            sleep 3
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-Forwarded-Proto: https' \
            -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASS\"}" \
            http://localhost:3000/api/auth/login/password)
          echo "login after restart -> HTTP $code"; test "$code" = 200
          docker logs auth-service 2>&1 | grep -c "BOOTSTRAP ADMIN: created" | grep -qx 1

      - name: Container logs
        if: always()
        run: |
          for c in auth-service api-gateway admin-portal; do
            echo "::group::$c"; docker logs "$c" 2>&1 | tail -150; echo "::endgroup::"
          done
