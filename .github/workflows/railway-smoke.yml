name: Railway smoke test

# Unit tests for the Ji-Hajoor additions in auth-service (MSG91, test OTP mode,
# first-admin bootstrap) and api-gateway (realtime query token, root route).
# The full stack, Railway-style, is exercised by the "Booking flow" workflow.

on:
  push:
    branches: [main, "railway/**", "sync/**"]
    paths:
      - pom.xml
      - shared/**
      - services/auth-service/**
      - services/api-gateway/**
      - .github/workflows/railway-smoke.yml
  pull_request:
    paths:
      - pom.xml
      - shared/**
      - services/auth-service/**
      - services/api-gateway/**
      - .github/workflows/railway-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: auth-service and api-gateway unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test auth-service and api-gateway
        run: mvn -B test -pl services/auth-service,services/api-gateway -am
