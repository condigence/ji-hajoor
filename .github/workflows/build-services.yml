name: Build services (reusable)

# Builds and tests the backend, packages the deployables and builds their images from the real
# Dockerfiles. Called by ci.yml (push to main/release) and pr-checks.yml (pull requests); not
# triggered on its own.
#
# Repository layout this relies on:
#   pom.xml                       Reactor and parent of every backend module (Java 25,
#                                 Spring Boot 4). One Maven run builds everything in order.
#   shared/*                      Libraries the services depend on.
#   services/<name>               Service modules: plain jars, hosted by a deployable.
#   apps/<deployable>             identity-app, jobs-app, money-app, engagement-app: one JVM each,
#                                 hosting several services. `mvn verify` produces
#                                 target/<deployable>-1.0.0-SNAPSHOT.jar, which is exactly what the
#                                 Dockerfile COPYs.
#   services/api-gateway          The fifth deployable (Spring Cloud Gateway).

on:
  workflow_call:
    inputs:
      services:
        description: >
          JSON array of deployables to build: any of identity-app, jobs-app, money-app,
          engagement-app, api-gateway.
        type: string
        required: true
      image-tag:
        description: Tag for the built images (the full commit SHA).
        type: string
        required: true
      min-line-coverage:
        description: JaCoCo line-coverage floor in percent per module. 0 turns the gate off.
        type: number
        default: 0
      push-images:
        description: >
          Push images to ECR after they pass the scan. Needs the ECR_REGISTRY,
          AWS_REGION and AWS_CI_ROLE_ARN repository variables and the caller to
          grant id-token: write.
        type: boolean
        default: false

# No permissions key: jobs inherit the caller's token permissions. ci.yml grants
# id-token: write (for the OIDC push); pr-checks.yml grants only contents: read,
# and never pushes.

env:
  JAVA_VERSION: '25'
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  # ─────────────────────────────────────────────
  # One reactor build: shared libraries, the services the deployables host, the deployables
  # ─────────────────────────────────────────────
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Maven repository
        uses: actions/cache@v4
        with:
          # Our own artifacts are never cached: they must come from this commit.
          path: |
            ~/.m2/repository
            !~/.m2/repository/com/jihajoor
          key: m2-${{ runner.os }}-reactor-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-reactor-

      - name: Resolve the modules to build
        id: modules
        env:
          DEPLOYABLES: ${{ inputs.services }}
        run: |
          modules=()
          for d in $(jq -r '.[]' <<< "${DEPLOYABLES}"); do
            if [ "${d}" = "api-gateway" ]; then dir="services/api-gateway"; else dir="apps/${d}"; fi
            if [ ! -f "${dir}/pom.xml" ]; then
              echo "::error::Unknown deployable '${d}' (no ${dir}/pom.xml)."
              exit 1
            fi
            modules+=("${dir}")
          done
          echo "list=$(IFS=,; echo "${modules[*]}")" >> "$GITHUB_OUTPUT"

      - name: Build, test and package
        # -am also builds and tests every module the deployables depend on.
        run: mvn verify -pl "${{ steps.modules.outputs.list }}" -am

      - name: Enforce line coverage (>= ${{ inputs.min-line-coverage }}%)
        if: inputs.min-line-coverage > 0
        env:
          MIN_COVERAGE: ${{ inputs.min-line-coverage }}
        run: |
          failed=0
          for report in services/*/target/site/jacoco/jacoco.csv shared/*/target/site/jacoco/jacoco.csv; do
            [ -f "${report}" ] || continue
            module=$(echo "${report}" | cut -d/ -f2)
            # jacoco.csv columns 8 and 9 are LINE_MISSED and LINE_COVERED.
            read -r MISSED COVERED < <(awk -F',' 'NR>1 {m += $8; c += $9} END {print m+0, c+0}' "${report}")
            TOTAL=$((MISSED + COVERED))
            [ "${TOTAL}" -eq 0 ] && continue
            COVERAGE=$(awk -v c="${COVERED}" -v t="${TOTAL}" 'BEGIN {printf "%.2f", c * 100 / t}')
            echo "| ${module} | ${COVERAGE}% |" >> "$GITHUB_STEP_SUMMARY"
            if awk -v c="${COVERAGE}" -v m="${MIN_COVERAGE}" 'BEGIN {exit !(c < m)}'; then
              echo "::error::Line coverage of ${module} is ${COVERAGE}%, below the ${MIN_COVERAGE}% floor."
              failed=1
            fi
          done
          exit "${failed}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/site/jacoco/
            shared/*/target/surefire-reports/
            apps/*/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload deployable jars
        uses: actions/upload-artifact@v4
        with:
          name: deployable-jars
          path: |
            apps/*/target/*-1.0.0-SNAPSHOT.jar
            services/api-gateway/target/api-gateway-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      # booking-service is the Pact consumer; its tests write the contracts the
      # providers verify. The contract-drift job compares them with the
      # providers' committed copies.
      - name: Upload generated pacts
        if: contains(fromJSON(inputs.services), 'jobs-app')
        uses: actions/upload-artifact@v4
        with:
          name: pacts-booking-service
          path: services/booking-service/target/pacts/
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────
  # One image per deployable: image → scan → (push)
  # ─────────────────────────────────────────────
  service:
    name: ${{ matrix.service }} image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
      LOCAL_IMAGE: jihajoor/${{ matrix.service }}:${{ inputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve the image context
        run: |
          if [ "${SERVICE}" = "api-gateway" ]; then dir="services/api-gateway"; else dir="apps/${SERVICE}"; fi
          echo "CONTEXT_DIR=${dir}" >> "$GITHUB_ENV"

      - name: Download deployable jars
        uses: actions/download-artifact@v4
        with:
          name: deployable-jars
          path: .

      - name: Check the jar the Dockerfile copies was produced
        run: |
          JAR=$(sed -n 's#^COPY[[:space:]]\{1,\}\(target/[^[:space:]]*\.jar\)[[:space:]].*#\1#p' "${CONTEXT_DIR}/Dockerfile" | head -n 1)
          if [ -z "${JAR}" ]; then
            echo "::error file=${CONTEXT_DIR}/Dockerfile::No 'COPY target/<name>.jar' line found."
            exit 1
          fi
          if [ ! -f "${CONTEXT_DIR}/${JAR}" ]; then
            echo "::error file=${CONTEXT_DIR}/Dockerfile::The Dockerfile copies ${JAR}, which the build did not produce."
            exit 1
          fi
          ls -l "${CONTEXT_DIR}/${JAR}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_DIR }}
          file: ${{ env.CONTEXT_DIR }}/Dockerfile
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.service }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by commit
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: json
          output: trivy-image.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Fail on fixable CRITICAL vulnerabilities
        shell: python
        run: |
          import json, sys
          report = json.load(open("trivy-image.json"))
          found = []
          for result in report.get("Results") or []:
              for v in result.get("Vulnerabilities") or []:
                  found.append((v.get("VulnerabilityID"), v.get("PkgName"), v.get("InstalledVersion"),
                                v.get("FixedVersion"), result.get("Target")))
          for vid, pkg, have, fixed, target in sorted(set(found))[:20]:
              print(f"::error title={vid}::{pkg} {have} -> fixed in {fixed} ({target})")
          sys.exit(1 if found else 0)

      - name: Check push configuration
        if: inputs.push-images
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_CI_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
        run: |
          missing=()
          for v in ECR_REGISTRY AWS_REGION AWS_CI_ROLE_ARN; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Image push is enabled but these repository variables are not set: ${missing[*]}"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        if: inputs.push-images
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: inputs.push-images
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: inputs.push-images
        env:
          REMOTE_IMAGE: ${{ vars.ECR_REGISTRY }}/${{ matrix.service }}:${{ inputs.image-tag }}
        run: |
          docker tag "${LOCAL_IMAGE}" "${REMOTE_IMAGE}"
          docker push "${REMOTE_IMAGE}"
          echo "Pushed ${REMOTE_IMAGE}" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # Pact drift: the providers verify committed copies of the consumer contracts
  # (@PactFolder), so a consumer change that is not copied across would never be
  # verified. Compare what booking-service generated with those copies.
  # ─────────────────────────────────────────────
  contract-drift:
    name: Pact contracts in sync
    needs: build
    if: contains(fromJSON(inputs.services), 'jobs-app')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download generated pacts
        uses: actions/download-artifact@v4
        with:
          name: pacts-booking-service
          path: generated-pacts

      - name: Compare with the providers' committed copies
        shell: python
        run: |
          import glob, json, os, sys

          # Example values in bodies can be generated per run (UUIDs, timestamps), so
          # body/content leaves are compared by JSON type only; structure, matching
          # rules, generators, paths, methods, statuses and headers must match exactly.
          def shape(node):
              if isinstance(node, dict):
                  return {k: shape(v) for k, v in node.items()}
              if isinstance(node, list):
                  return [shape(v) for v in node]
              return type(node).__name__

          def normalise(pact):
              pact = dict(pact)
              pact.pop("metadata", None)
              for key in ("interactions", "messages"):
                  items = []
                  for item in pact.get(key, []):
                      item = json.loads(json.dumps(item))
                      for part in (item, item.get("request", {}), item.get("response", {})):
                          for field in ("body", "contents"):
                              if field in part:
                                  part[field] = shape(part[field])
                      items.append(item)
                  if key in pact:
                      pact[key] = sorted(items, key=lambda i: i.get("description", ""))
              return pact

          generated = sorted(glob.glob("generated-pacts/*.json"))
          if not generated:
              print("::error::booking-service produced no pact files.")
              sys.exit(1)
          failed = False
          for path in generated:
              pact = json.load(open(path))
              provider = pact["provider"]["name"]
              committed = f"services/{provider}/src/test/resources/pacts/{os.path.basename(path)}"
              if not os.path.exists(committed):
                  print(f"::error::{provider} has no committed copy of {os.path.basename(path)} at {committed}.")
                  failed = True
                  continue
              if normalise(pact) != normalise(json.load(open(committed))):
                  print(f"::error file={committed}::Out of date with the contract booking-service now generates. "
                        f"Copy services/booking-service/target/pacts/{os.path.basename(path)} over it.")
                  # The artifact can be hard to reach; show the generated contract in the run.
                  print(f"::notice title=generated {os.path.basename(path)}::"
                        + json.dumps(pact, sort_keys=True).replace("%", "%25"))
                  failed = True
              else:
                  print(f"{committed}: in sync")
          sys.exit(1 if failed else 0)
