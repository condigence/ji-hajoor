      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?set RAZORPAY_WEBHOOK_SECRET, see .env.example}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET, see .env.example}
      # Razorpay test-mode keys; optional. Set them and PAYMENT_DEFAULT_GATEWAY=razorpay in .env
      # to pay through real Razorpay Checkout instead of the simulator.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # Payments are priced from the booking, not the client: the Booking Service's internal
      # payment-facts and payment-pending endpoints, called with the shared service credential.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY, see .env.example}
      BOOKING_SERVICE_URL: http://booking-service:8084
      # Credits each paid booking's earning to the provider's wallet (idempotent per booking).
      PROVIDER_WALLET_CLIENT: http
      PROVIDER_SERVICE_URL: http://provider-service:8083
      # Local only: no real gateway can send the signed webhook that settles a payment, so a
      # simulator settles it through the same signed-callback path. Never enabled in Helm.
      # 'razorpay' works locally too, because Checkout's confirmation settles the payment.
      PAYMENT_DEFAULT_GATEWAY: ${PAYMENT_DEFAULT_GATEWAY:-simulator}
      PAYMENT_SIMULATOR_ENABLED: "true"
      PAYMENT_SIMULATOR_SECRET: ${PAYMENT_SIMULATOR_SECRET:-local-payment-simulator-secret}
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  invoice-service:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    build:
      context: ./services/invoice-service
    # Without a container limit the JVM sizes its max heap at 25% of the whole
    # WSL VM (~1.9 GB each), so twenty idle services feel no pressure to collect
    # and between them exhaust the host. A limit makes the JVM container-aware;
    # measured steady-state usage for these services is ~340-400 MB.
    mem_limit: 448m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
      DB_URL: jdbc:postgresql://${HOMEFIX_DB_HOST:-host.docker.internal}:${HOMEFIX_DB_PORT:-5432}/${HOMEFIX_DB_NAME:-homefix}
      DB_USERNAME: homefix
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, see .env.example}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      REDIS_HOST: ${HOMEFIX_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: "${HOMEFIX_REDIS_PORT:-6379}"
      KAFKA_BOOTSTRAP_SERVERS: ${HOMEFIX_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9094}
      SERVER_PORT: "8089"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, see .env.example}
