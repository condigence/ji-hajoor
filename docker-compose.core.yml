# HomeFix — full local stack: all 20 backend services + all three SPAs.
#
# Postgres, Redis and Kafka are NOT containers here: locally the services use the ones
# installed on this machine, reached from the containers through host.docker.internal
# (Postgres :5432, Redis :6379, Kafka :9094 — a listener advertised as host.docker.internal).
# Setup of each is in docs/LOCAL_ACCESS.md. Override with HOMEFIX_DB_HOST / _DB_PORT / _DB_NAME,
# HOMEFIX_REDIS_HOST / _REDIS_PORT and HOMEFIX_KAFKA_BOOTSTRAP_SERVERS; to run them as containers
# instead, add docker-compose.infra.yml (see its header). AWS deployments do not use this file:
# Helm wires RDS, ElastiCache and MSK per environment (helm/services/*.yaml).
#
# Schemas come from each service's Flyway migrations (src/main/resources/db/migration), the
# same as on AWS; Hibernate only validates. The shared outbox tables ship in homefix-shared-outbox.
#
#   cp .env.example .env            # local-dev secrets; compose refuses to start without it
#   docker compose -f docker-compose.core.yml up -d --build --wait
#   bash docker/seed-pricing.sh      # once per database, before the first price estimate
#
# Health checks allow a 300 s start period: on a cold start all twenty JVMs boot at once and,
# CPU-bound, several need 3-5 minutes. Failures inside the start period do not count, so
# `up --wait` no longer gives up on a service that is merely slow.
#
# Then open:
#   http://localhost:5173  customer-app
#   http://localhost:5174  provider-app
#   http://localhost:5175  admin-portal
#
# Each SPA proxies /api/auth to the Auth Service and /api to the API Gateway.
# Log in with any Indian mobile number; the dev SMS gateway logs the OTP instead
# of sending it:
#   docker logs homefix-core-auth-service-1 | grep "DEV SMS"

name: homefix-core

services:
  auth-service:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    build:
      context: ./services/auth-service
    # Without a container limit the JVM sizes its max heap at 25% of the whole
    # WSL VM (~1.9 GB each), so twenty idle services feel no pressure to collect
    # and between them exhaust the host. A limit makes the JVM container-aware;
    # measured steady-state usage for these services is ~340-400 MB.
    mem_limit: 448m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
      DB_URL: jdbc:postgresql://${HOMEFIX_DB_HOST:-host.docker.internal}:${HOMEFIX_DB_PORT:-5432}/${HOMEFIX_DB_NAME:-homefix}
      DB_USERNAME: homefix
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, see .env.example}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      REDIS_HOST: ${HOMEFIX_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: "${HOMEFIX_REDIS_PORT:-6379}"
      SERVER_PORT: "8081"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, see .env.example}
      # Shared service credential for the Auth Service /internal/** endpoints
      # (the Notification Service's contact lookup).
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY, see .env.example}
      # Google Sign-In: set this to your Google OAuth client id and the
      # SAME value as VITE_GOOGLE_CLIENT_ID in frontend/*/.env. Empty means
      # the ID token audience cannot be validated, so social login is off.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      # Sign in with Apple: your Apple Services ID. Empty means Apple login is not offered.
      APPLE_SERVICES_ID: "${APPLE_SERVICES_ID:-}"
      # Dev-only SMS gateway: appends the verification code to a mounted file so
      # a login can be completed without querying container logs. Never outside dev.
      SMS_PROVIDER: file
      SMS_FILE_PATH: /var/log/homefix/dev-sms.log
      # LOCAL DEV ONLY: echo the OTP to the auth-service log so the flow can be tested
      # without a real SMS gateway. Never enable outside local/dev.
      HOMEFIX_SMS_LOGOTP: "true"
      # LOCAL DEV ONLY: create the test accounts in docs/LOCAL_ACCESS.md at startup,
      # each with a console username and this password, so the portals can be signed
      # in to on a fresh database. Staff roles cannot be self-assigned at registration,
      # so without this nothing can open the Admin Portal. Never enable outside dev.
      DEV_SEED_ENABLED: "${DEV_SEED_ENABLED:-false}"
      DEV_SEED_PASSWORD: "${DEV_SEED_PASSWORD:-}"
    ports:
      - "8081:8081"
    volumes:
      # Host-readable sink for the dev SMS gateway (see SMS_PROVIDER above).
      - ./docker/dev-sms:/var/log/homefix
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s

  api-gateway:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    build:
      context: ./services/api-gateway
    # Without a container limit the JVM sizes its max heap at 25% of the whole
    # WSL VM (~1.9 GB each), so twenty idle services feel no pressure to collect
    # and between them exhaust the host. A limit makes the JVM container-aware;
    # measured steady-state usage for these services is ~340-400 MB.
    mem_limit: 448m
    environment:
      # networkaddress.cache.ttl bounds the JDK DNS cache the introspection
      # WebClient now resolves through, so a recreated auth-service is picked
      # up in seconds instead of Docker DNS's 600s record TTL.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -Dnetworkaddress.cache.ttl=10 -Dnetworkaddress.cache.negative.ttl=1"
      REDIS_HOST: ${HOMEFIX_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: "${HOMEFIX_REDIS_PORT:-6379}"
      SERVER_PORT: "8080"
      HTTPS_ENFORCED: "false"
      AUTH_SERVICE_URI: http://auth-service:8081
      AUTH_INTROSPECT_URI: http://auth-service:8081/auth/introspect
      CATALOG_SERVICE_URI: http://catalog-service:8085
      CUSTOMER_SERVICE_URI: http://customer-service:8082
      BOOKING_SERVICE_URI: http://booking-service:8084
      PRICING_ENGINE_URI: http://pricing-engine:8086
      LOCATION_SERVICE_URI: http://location-service:8092
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s

