# Ji-Hajoor — full local stack: the backend in five deployables + all three SPAs.
#
# Postgres, Redis and Kafka are NOT containers here: locally the services use the ones
# installed on this machine, reached from the containers through host.docker.internal
# (Postgres :5432, Redis :6379, Kafka :9094 — a listener advertised as host.docker.internal).
# Setup of each is in docs/LOCAL_ACCESS.md. Override with JIHAJOOR_DB_HOST / _DB_PORT / _DB_NAME,
# JIHAJOOR_REDIS_HOST / _REDIS_PORT and JIHAJOOR_KAFKA_BOOTSTRAP_SERVERS; to run them as containers
# instead, add docker-compose.infra.yml (see its header). AWS deployments do not use this file:
# Helm wires RDS, ElastiCache and MSK per environment (helm/services/*.yaml).
#
# Schemas come from each service's Flyway migrations (src/main/resources/db/migration/<service>), the
# same as on AWS; Hibernate only validates. The shared outbox tables ship in jihajoor-shared-outbox.
#
#   cp .env.example .env            # local-dev secrets; compose refuses to start without it
#   docker compose -f docker-compose.core.yml up -d --build --wait
#   bash docker/seed-pricing.sh      # once per database, before the first price estimate
#
# Health checks allow a 180 s start period: a deployable starts its services one after another,
# and is healthy only when every one of them reports ready. Failures inside the start period do
# not count, so `up --wait` does not give up on a deployable that is merely slow.
#
# Then open:
#   http://localhost:5173  customer-app
#   http://localhost:5174  provider-app
#   http://localhost:5175  admin-portal
#
# Each SPA proxies /api/auth to the Auth Service and /api to the API Gateway.
# Log in with any Indian mobile number; the dev SMS gateway logs the OTP instead
# of sending it:
#   docker logs jihajoor-core-identity-app-1 | grep "DEV SMS"

name: jihajoor-core

# The 19 backend services run in four deployables (plus the API gateway); each deployable is one
# JVM that hosts its services side by side, each in its own Spring context on the port it always
# had (see shared/jihajoor-service-host). Service-to-service URLs therefore point at the deployable:
# http://jobs-app:8084 is booking-service. A value that must differ between services sharing a
# JVM can be set per service as <SERVICE>__<VAR>, e.g. BOOKING_SERVICE__DB_USERNAME.

services:

  identity-app:
    # Hosts auth-service, customer-service, provider-service, verification-service.
    restart: "on-failure:5"
    build:
      context: ./apps/identity-app
    # One JVM for 4 services: a container limit keeps the JVM container-aware.
    mem_limit: 896m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k"
      DB_URL: jdbc:postgresql://${JIHAJOOR_DB_HOST:-host.docker.internal}:${JIHAJOOR_DB_PORT:-5432}/${JIHAJOOR_DB_NAME:-jihajoor}
      DB_USERNAME: jihajoor
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, see .env.example}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      REDIS_HOST: ${JIHAJOOR_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: "${JIHAJOOR_REDIS_PORT:-6379}"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, see .env.example}
      # Shared service credential for the Auth Service /internal/** endpoints
      # (the Notification Service's contact lookup).
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY, see .env.example}
      # Google Sign-In: set this to your Google OAuth client id and the
      # SAME value as VITE_GOOGLE_CLIENT_ID in frontend/*/.env. Empty means
      # the ID token audience cannot be validated, so social login is off.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      # Sign in with Apple: your Apple Services ID. Empty means Apple login is not offered.
      APPLE_SERVICES_ID: "${APPLE_SERVICES_ID:-}"
      # Dev-only SMS gateway: appends the verification code to a mounted file so
      # a login can be completed without querying container logs. Never outside dev.
      SMS_PROVIDER: file
      SMS_FILE_PATH: /var/log/jihajoor/dev-sms.log
      # LOCAL DEV ONLY: echo the OTP to the auth-service log so the flow can be tested
      # without a real SMS gateway. Never enable outside local/dev.
      JIHAJOOR_SMS_LOGOTP: "true"
      # LOCAL DEV ONLY: create the test accounts in docs/LOCAL_ACCESS.md at startup,
      # each with a console username and this password, so the portals can be signed
      # in to on a fresh database. Staff roles cannot be self-assigned at registration,
      # so without this nothing can open the Admin Portal. Never enable outside dev.
      DEV_SEED_ENABLED: "${DEV_SEED_ENABLED:-false}"
      DEV_SEED_PASSWORD: "${DEV_SEED_PASSWORD:-}"
      # Email. Default "file" (dev only): sign-up codes, reset codes and staff invitation links
      # are appended to docker/dev-mail/dev-mail.log, which docker/verify-signup.sh and the apps'
      # dev hints read. EMAIL_PROVIDER=smtp sends real SMTP instead; with the "mail" profile
      # (docker compose --profile mail up) that is Mailpit, inbox at http://localhost:8025.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-file}
      EMAIL_FILE_PATH: /var/log/jihajoor-mail/dev-mail.log
      EMAIL_FROM: ${EMAIL_FROM:-Ji-Hajoor <no-reply@jihajoor.local>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: "${SMTP_PORT:-1025}"
      # Invitation links point at jihajoor.apps.admin-portal-url in config.app_config (seeded
      # with http://localhost:5175).
      KMS_PROVIDER: local
      # Base64 AES-256 data key for the local KMS adapter (no default any more).
      KMS_LOCAL_DATA_KEY: ${KMS_LOCAL_DATA_KEY:?set KMS_LOCAL_DATA_KEY, see .env.example}
      GEOCODING_PROVIDER: noop
      BOOKING_SERVICE_URL: http://jobs-app:8084
      # Base64 AES-256 data key for the local KMS adapter (no default any more).
      KMS_DATA_KEY: ${KMS_DATA_KEY:?set KMS_DATA_KEY, see .env.example}
      # Read live active jobs from the Booking Service's internal surface (Req 28.8).
      BOOKING_CLIENT: http
      BOOKING_SERVICE_URI: http://jobs-app:8084
      CATALOG_SERVICE_URI: http://jobs-app:8085
      # Batch APPROVED lookup behind the dispatch eligibility search (Req 5.10, 8.2).
      VERIFICATION_SERVICE_URL: http://identity-app:8094
      # Looks accounts up by mobile number and grants/revokes TENANT_ADMIN when a platform admin
      # manages a Tenant's administrators (Requirement MT-2).
      AUTH_SERVICE_URL: http://identity-app:8081
      # Local only: a simulator verifies a well-formed bank account immediately, standing in for the
      # bank "penny drop" check. Deployments default to manual verification by a platform admin.
      BANK_ACCOUNT_VERIFICATION: simulator
      PROVIDER_SERVICE_URL: http://identity-app:8083
      # Provider verification documents (verification-service): "auto" uses S3 when DOCUMENTS_BUCKET
      # is set (and reachable) in .env, otherwise the local directory below, which is mounted so
      # documents survive a container restart. DOCUMENTS_S3_ENDPOINT points it at MinIO/LocalStack.
      DOCUMENT_STORAGE_PROVIDER: ${DOCUMENT_STORAGE_PROVIDER:-auto}
      DOCUMENTS_LOCAL_DIR: /var/lib/jihajoor-documents
      DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:-}
      DOCUMENTS_S3_REGION: ${DOCUMENTS_S3_REGION:-}
      DOCUMENTS_S3_ENDPOINT: ${DOCUMENTS_S3_ENDPOINT:-}
      DOCUMENTS_S3_PATH_STYLE_ACCESS: "${DOCUMENTS_S3_PATH_STYLE_ACCESS:-false}"
      DOCUMENTS_S3_ACCESS_KEY_ID: ${DOCUMENTS_S3_ACCESS_KEY_ID:-}
      DOCUMENTS_S3_SECRET_ACCESS_KEY: ${DOCUMENTS_S3_SECRET_ACCESS_KEY:-}
    ports:
      - "8081:8081"  # auth-service
      - "8082:8082"  # customer-service
      - "8083:8083"  # provider-service
      - "8094:8094"  # verification-service
    volumes:
      # Host-readable sink for the dev SMS gateway (see SMS_PROVIDER above).
      - ./docker/dev-sms:/var/log/jihajoor
      # Host-readable Dev_Mail_Log (see EMAIL_PROVIDER above).
      - ./docker/dev-mail:/var/log/jihajoor-mail
      # Locally stored verification documents (DOCUMENT_STORAGE_PROVIDER above). Real ID scans
      # when testing with real data: keep the directory out of version control.
      - ./docker/dev-documents:/var/lib/jihajoor-documents
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health/readiness && wget -qO- http://localhost:8082/health/readiness && wget -qO- http://localhost:8083/health/readiness && wget -qO- http://localhost:8094/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s

  jobs-app:
    # Hosts catalog-service, pricing-engine, promotion-service, booking-service, dispatch-engine, location-service, chat-service.
    restart: "on-failure:5"
    build:
      context: ./apps/jobs-app
    # One JVM for 7 services: a container limit keeps the JVM container-aware.
    mem_limit: 1280m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k"
      DB_URL: jdbc:postgresql://${JIHAJOOR_DB_HOST:-host.docker.internal}:${JIHAJOOR_DB_PORT:-5432}/${JIHAJOOR_DB_NAME:-jihajoor}
      DB_USERNAME: jihajoor
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, see .env.example}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      REDIS_HOST: ${JIHAJOOR_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: "${JIHAJOOR_REDIS_PORT:-6379}"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, see .env.example}
      CATALOG_CACHE: memory
      PRICING_CACHE: memory
      # Coupon discounts are quoted by promotion-service's /internal/coupons/{code}/quote,
      # which requires the shared service credential.
      PROMOTION_SERVICE_URL: http://jobs-app:8098
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY, see .env.example}
      PRICING_ENGINE__LOGGING_LEVEL_COM_JIHAJOOR_SHARED_SECURITY: DEBUG
      CATALOG_CLIENT: http
      CATALOG_SERVICE_URL: http://jobs-app:8085
      PRICING_CLIENT: http
      PRICING_ENGINE_URL: http://jobs-app:8086
      CUSTOMER_CLIENT: http
      CUSTOMER_SERVICE_URL: http://identity-app:8082
      # Job photos: "auto" uses S3 when MEDIA_BUCKET is set (and reachable) in .env, otherwise
      # the local directory below, which is mounted so photos survive a container restart.
      # MEDIA_S3_ENDPOINT points it at MinIO/LocalStack instead of AWS.
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-auto}
      MEDIA_LOCAL_DIR: /var/lib/jihajoor-media
      MEDIA_BUCKET: ${MEDIA_BUCKET:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_PATH_STYLE_ACCESS: "${MEDIA_S3_PATH_STYLE_ACCESS:-false}"
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      # Routes bookings automatic matching could not place to the Tenants covering them, and
      # checks a Tenant admin's assignments (Requirement MT-4, MT-5).
      PROVIDER_SERVICE_URL: http://identity-app:8083
      TENANT_ASSIGNMENT_TIMEOUT: PT60M
      # Consumes PaymentCompleted to move a paid booking to PAYMENT_COMPLETED.
      KAFKA_BOOTSTRAP_SERVERS: ${JIHAJOOR_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9094}
      BOOKING_SERVICE_URL: http://jobs-app:8084
      NOTIFICATION_SERVICE_URL: http://engagement-app:8090
      LOCATION_STORE: redis
    volumes:
      # Locally stored job photos (MEDIA_STORAGE_PROVIDER above), readable from the host.
      - ./docker/dev-media:/var/lib/jihajoor-media
    ports:
      - "8085:8085"  # catalog-service
      - "8086:8086"  # pricing-engine
      - "8098:8098"  # promotion-service
      - "8084:8084"  # booking-service
      - "8087:8087"  # dispatch-engine
      - "8092:8092"  # location-service
      - "8093:8093"  # chat-service
    depends_on:
      identity-app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health/readiness && wget -qO- http://localhost:8086/health/readiness && wget -qO- http://localhost:8098/health/readiness && wget -qO- http://localhost:8084/health/readiness && wget -qO- http://localhost:8087/health/readiness && wget -qO- http://localhost:8092/health/readiness && wget -qO- http://localhost:8093/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s

  money-app:
    # Hosts payment-service, invoice-service.
    restart: "on-failure:5"
    build:
      context: ./apps/money-app
    # One JVM for 2 services: a container limit keeps the JVM container-aware.
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k"
      DB_URL: jdbc:postgresql://${JIHAJOOR_DB_HOST:-host.docker.internal}:${JIHAJOOR_DB_PORT:-5432}/${JIHAJOOR_DB_NAME:-jihajoor}
      DB_USERNAME: jihajoor
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, see .env.example}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      REDIS_HOST: ${JIHAJOOR_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: "${JIHAJOOR_REDIS_PORT:-6379}"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, see .env.example}
      # Base64 AES-256 data key for the local KMS adapter (no default any more).
      KMS_DATA_KEY: ${KMS_DATA_KEY:?set KMS_DATA_KEY, see .env.example}
      # Gateway webhook signing secrets (HMAC-SHA256); no defaults any more.
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?set RAZORPAY_WEBHOOK_SECRET, see .env.example}
      # Razorpay test-mode keys; optional. Set them and PAYMENT_DEFAULT_GATEWAY=razorpay in .env
      # to pay through real Razorpay Checkout instead of the simulator.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # Payments are priced from the booking, not the client: the Booking Service's internal
      # payment-facts and payment-pending endpoints, called with the shared service credential.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY, see .env.example}
      BOOKING_SERVICE_URL: http://jobs-app:8084
      # Credits each paid booking's earning to the provider's wallet (idempotent per booking).
      PROVIDER_WALLET_CLIENT: http
      PROVIDER_SERVICE_URL: http://identity-app:8083
      # Local only: no real gateway can send the signed webhook that settles a payment, so a
      # simulator settles it through the same signed-callback path. Never enabled in Helm.
      # 'razorpay' works locally too, because Checkout's confirmation settles the payment.
      PAYMENT_DEFAULT_GATEWAY: ${PAYMENT_DEFAULT_GATEWAY:-simulator}
      PAYMENT_SIMULATOR_ENABLED: "true"
      PAYMENT_SIMULATOR_SECRET: ${PAYMENT_SIMULATOR_SECRET:-local-payment-simulator-secret}
      KAFKA_BOOTSTRAP_SERVERS: ${JIHAJOOR_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9094}
      NOTIFICATION_SERVICE_URL: http://engagement-app:8090
    ports:
      - "8088:8088"  # payment-service
      - "8089:8089"  # invoice-service
    depends_on:
      jobs-app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/health/readiness && wget -qO- http://localhost:8089/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s

  engagement-app:
    # Hosts outbox-processor, notification-service, complaint-service, rating-review-service, admin-service, reporting-service.
    restart: "on-failure:5"
    build:
      context: ./apps/engagement-app
    # One JVM for 6 services: a container limit keeps the JVM container-aware.
    mem_limit: 1152m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k"
      DB_URL: jdbc:postgresql://${JIHAJOOR_DB_HOST:-host.docker.internal}:${JIHAJOOR_DB_PORT:-5432}/${JIHAJOOR_DB_NAME:-jihajoor}
      DB_USERNAME: jihajoor
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, see .env.example}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      KAFKA_BOOTSTRAP_SERVERS: ${JIHAJOOR_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9094}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, see .env.example}
      PREFERENCE_SERVICE_URL: http://identity-app:8082
      # Recipient contact details are resolved from the Auth Service by user id,
      # authenticated with the shared service credential.
      AUTH_SERVICE_URL: http://identity-app:8081
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY, see .env.example}
      REDIS_HOST: ${JIHAJOOR_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: "${JIHAJOOR_REDIS_PORT:-6379}"
      # Booking and complaint emails: logged by default; "smtp" sends them through SMTP_HOST
      # (Mailpit with the "mail" profile), like identity-app's EMAIL_PROVIDER.
      # Complaint refunds go to payment-service, review ratings to provider-service.
      PAYMENT_SERVICE_URL: http://money-app:8088
      PROVIDER_SERVICE_URL: http://identity-app:8083
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-log}
      NOTIFICATION_EMAIL_FROM: ${EMAIL_FROM:-Ji-Hajoor <no-reply@jihajoor.local>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: "${SMTP_PORT:-1025}"
    ports:
      - "8099:8099"  # outbox-processor
      - "8090:8090"  # notification-service
      - "8091:8091"  # complaint-service
      - "8097:8097"  # rating-review-service
      - "8095:8095"  # admin-service
      - "8096:8096"  # reporting-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8099/health/readiness && wget -qO- http://localhost:8090/health/readiness && wget -qO- http://localhost:8091/health/readiness && wget -qO- http://localhost:8097/health/readiness && wget -qO- http://localhost:8095/health/readiness && wget -qO- http://localhost:8096/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s

  api-gateway:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    build:
      context: ./services/api-gateway
    # Without a container limit the JVM sizes its max heap at 25% of the whole
    # WSL VM (~1.9 GB each), so twenty idle services feel no pressure to collect
    # and between them exhaust the host. A limit makes the JVM container-aware;
    # measured steady-state usage for these services is ~340-400 MB.
    mem_limit: 448m
    environment:
      # networkaddress.cache.ttl bounds the JDK DNS cache the introspection
      # WebClient now resolves through, so a recreated auth-service is picked
      # up in seconds instead of Docker DNS's 600s record TTL.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -Dnetworkaddress.cache.ttl=10 -Dnetworkaddress.cache.negative.ttl=1"
      REDIS_HOST: ${JIHAJOOR_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: "${JIHAJOOR_REDIS_PORT:-6379}"
      SERVER_PORT: "8080"
      HTTPS_ENFORCED: "false"
      AUTH_SERVICE_URI: http://identity-app:8081
      AUTH_INTROSPECT_URI: http://identity-app:8081/auth/introspect
      CATALOG_SERVICE_URI: http://jobs-app:8085
      CUSTOMER_SERVICE_URI: http://identity-app:8082
      BOOKING_SERVICE_URI: http://jobs-app:8084
      PRICING_ENGINE_URI: http://jobs-app:8086
      LOCATION_SERVICE_URI: http://jobs-app:8092
    ports:
      - "8080:8080"
    depends_on:
      identity-app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s

  customer-app:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    build:
      context: ./frontend/customer-app
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
      - identity-app

  provider-app:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    build:
      context: ./frontend/provider-app
    ports:
      - "5174:80"
    depends_on:
      - api-gateway
      - identity-app

  admin-portal:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    build:
      context: ./frontend/admin-portal
    ports:
      - "5175:80"
    depends_on:
      - api-gateway
      - identity-app

  mailpit:
    # Local SMTP server with a web inbox (http://localhost:8025), the dev stand-in for Amazon SES.
    # Opt-in: docker compose --profile mail up, with EMAIL_PROVIDER=smtp and
    # NOTIFICATION_EMAIL_PROVIDER=smtp in .env.
    image: axllent/mailpit:v1.21.8
    profiles: ["mail"]
    ports:
      - "8025:8025"  # web inbox
      - "1025:1025"  # SMTP
