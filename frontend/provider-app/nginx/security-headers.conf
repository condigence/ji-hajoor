# Security headers for every response (included by each location, because nginx
# drops inherited add_header lines in any block that declares its own).
server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Browsers remember to use https only (Railway's edge terminates TLS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(self \"https://checkout.razorpay.com\"), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Only this site's own scripts run, plus Google sign-in and Razorpay checkout.
# MUI writes inline styles, hence 'unsafe-inline' for styles only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss://$host https://accounts.google.com https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://accounts.google.com https://api.razorpay.com https://checkout.razorpay.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com https://appleid.apple.com; frame-ancestors 'none'; upgrade-insecure-requests" always;
