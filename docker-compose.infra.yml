# HomeFix — containerised Postgres/Redis/Kafka, for machines WITHOUT them installed locally.
#
# The default local run (docker-compose.core.yml alone) uses the Postgres, Redis and Kafka
# installed on the host; see docs/LOCAL_ACCESS.md. Use this file instead when they are not
# installed. Point the services at these containers with the HOMEFIX_* variables:
#
#   HOMEFIX_DB_HOST=postgres HOMEFIX_REDIS_HOST=redis HOMEFIX_KAFKA_BOOTSTRAP_SERVERS=kafka:9092 \
#     docker compose -f docker-compose.core.yml -f docker-compose.infra.yml up -d --build --wait
#
# (or put those three variables in .env). Start postgres/redis/kafka first so the services do
# not race Kafka's DNS on the way up. Host ports are remapped (5533/6380/9095) so they do not
# collide with a locally installed Postgres/Redis/Kafka on the default ports.

services:
  postgres:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    image: postgres:16-alpine
    # Headroom for the whole stack: every DB-backed service holds a small pool
    # (see SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE below), and the default
    # limit of 100 is not enough for 18 of them plus psql sessions.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: homefix
      POSTGRES_USER: homefix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, see .env.example}
    ports:
      - "5533:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homefix -d homefix"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    image: apache/kafka:3.7.1
    ports:
      - "9095:9092"
    # Kafka defaults to a 1 GB heap. This stack is a handful of low-volume
    # topics, so the default is pure reservation against a tight host.
    mem_limit: 768m
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      # This probe starts a JVM, so it is inherently slow and the timeout has to allow for that.
      # At the previous 10s timeout with a 20s start period it failed on a loaded machine every
      # time, and because eight services depend on kafka being healthy, Compose then refused to
      # start any of them. The broker itself was running fine throughout; only the probe was
      # timing out. Widened to a realistic budget rather than reducing what it checks, since
      # listing topics is what actually proves the broker is serving requests.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 60s

volumes:
  pgdata:
