# Loaded in addition to the main chat-service.yml (config/ has higher precedence).
# Tests run on H2 with Hibernate generating the schema; the Flyway migrations are
# PostgreSQL DDL and are exercised against the real database instead.
spring.flyway.enabled=false
# Tests do not read settings from the config.app_config table.
jihajoor.app-config.enabled=false
# Single-node chat: in-memory presence and direct delivery, no Redis server needed.
jihajoor.chat.cluster=local
management.health.redis.enabled=false
