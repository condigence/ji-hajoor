spring:
  application:
    name: pricing-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pricing
        # Lets ddl-auto=update (docker-compose.core.yml) create the 'pricing' schema itself.
        # docker/init-db.sql creates it too, but only on a fresh volume; without this a stack
        # whose Postgres volume predates the schema fails every parameter read and write. Inert
        # under 'validate' (the default here), which never issues DDL.
        hbm2ddl:
          create_namespaces: true
    open-in-view: false
  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: pricing
    default-schema: pricing
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8086}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  pricing:
    # Selects the active PricingConfigCachePort adapter: 'redis' (production) or 'memory'
    # (dev/test). Both enforce the same 60-second TTL so Admin parameter updates are picked up
    # by new bookings within 60 s (Requirement 6.11).
    cache: ${PRICING_CACHE:memory}
    # ISO-8601 duration; 60 seconds satisfies the Requirement 6.11 propagation bound.
    config-cache-ttl: 60s
    # Multiplier caps (Requirement 6.2, 6.3). Emergency is applied first, then surge; the
    # combined effective multiplier is capped at the sum of these two (Requirement 6.4).
    max-emergency-multiplier: 2.0
    max-surge-multiplier: 2.0
    # Minimum permissible final total (Requirement 6.1).
    min-total: 0.01
    # Monetary rounding scale/mode applied to every component and the total.
    money-scale: 2
    money-rounding: HALF_UP
    # Local timezone used to evaluate night/weekend surcharge windows (Requirement 6.5, 6.6).
    zone-id: ${PRICING_ZONE:UTC}
    # Coupon discounts are quoted by the Promotion Service, which owns coupons and their usage
    # counters (Requirement 6.10, 21.2), via its service-to-service GET /internal/coupons/{code}/quote.
    promotion:
      base-url: ${PROMOTION_SERVICE_URL:http://promotion-service:8098}
      # Shared service credential sent as X-Internal-Api-Key. No usable default: when unset,
      # estimates without a coupon still work and estimates with one fail with
      # 503 COUPON_SERVICE_UNAVAILABLE.
      internal-api-key: ${INTERNAL_API_KEY:}
      # Kept well inside the Booking Service's 5 s budget for the whole estimate call, which
      # also retries a 5xx; this client therefore does not retry on its own.
      connect-timeout: 1s
      read-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  # Do not fail readiness on Redis in the in-memory cache profile.
  health:
    redis:
      enabled: ${PRICING_REDIS_HEALTH:false}
  metrics:
    tags:
      application: pricing-engine
