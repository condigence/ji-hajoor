spring:
  application:
    name: provider-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: provider
    open-in-view: false

  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: provider
    default-schema: provider
    baseline-on-migrate: true
    baseline-version: 1
server:
  port: ${SERVER_PORT:8083}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  booking:
    # 'http' reads live active jobs from the Booking Service; 'stub' reports none (Req 28.8).
    client: ${BOOKING_CLIENT:stub}
    base-url: ${BOOKING_SERVICE_URI:http://booking-service:8084}
    # Must match the Booking Service's homefix.booking.internal-api-key.
    internal-api-key: ${INTERNAL_API_KEY:}
  catalog:
    base-url: ${CATALOG_SERVICE_URI:http://catalog-service:8085}
  verification:
    # Batch APPROVED lookup behind the dispatch eligibility search (Req 5.10, 8.2).
    base-url: ${VERIFICATION_SERVICE_URL:http://verification-service:8094}
    # Must match the Verification Service's homefix.verification.internal-api-key. When unset,
    # no provider can be confirmed APPROVED and every eligibility search returns nobody.
    internal-api-key: ${INTERNAL_API_KEY:}
  provider:
    # Shared service credential other services present on /internal/** (X-Internal-Api-Key),
    # i.e. the Dispatch Engine's eligible-provider search. Same INTERNAL_API_KEY as above.
    # No usable default: when unset every /internal/** request is refused (fail closed).
    internal-api-key: ${INTERNAL_API_KEY:}
    # Auth Service internal surface used by Tenant administration (Requirements MT-2.2, MT-2.4,
    # MT-3.2): account lookup by mobile number and the TENANT_ADMIN grant / revoke. Presents the
    # internal-api-key above.
    auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
    # How a newly added settlement bank account is verified (Requirement 14.2): 'manual' (default)
    # leaves it pending until an ADMIN / SUPER_ADMIN / FINANCE_ADMIN calls
    # POST /admin/providers/{id}/bank-account/verification; 'simulator' verifies well-formed
    # details at once and is for local stacks only — never set it in a deployed environment.
    bank-verification: ${BANK_ACCOUNT_VERIFICATION:manual}
    # Zone the weekly availability slots are read in by the eligibility search.
    availability-zone: ${PROVIDER_AVAILABILITY_ZONE:Asia/Kolkata}
    max-active-categories: 5
    max-subcategories-per-category: 10
    min-skill-tags: 1
    max-skill-tags: 20
    min-years-experience: 0
    max-years-experience: 50
    min-service-radius-km: 1
    max-service-radius-km: 100
    min-settlement-amount: 1.00
    review-rating-threshold: 3.0
  kms:
    # Selects the active KMS encryption adapter behind KmsEncryptionPort.
    # 'local' uses an AES-GCM adapter with a configured data key (dev/test); in production
    # an AWS KMS adapter can be added behind the same port without touching business logic.
    provider: ${KMS_PROVIDER:local}
    # Base64-encoded 256-bit data key used by the local AES-GCM adapter (dev/test only).
    # Required: no default, so the service fails fast when KMS_DATA_KEY is not set.
    data-key: ${KMS_DATA_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: provider-service
