spring:
  servlet:
    multipart:
      # Verification documents arrive as phone photos or PDFs, three per request; Spring's default
      # (1 MB per file) refused ordinary phone photos with 413 before the service saw them.
      max-file-size: 10MB
      max-request-size: 32MB
  application:
    name: verification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jihajoor}
    username: ${DB_USERNAME:jihajoor}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: verification
    open-in-view: false

  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: verification
    # Unique per service: the services of a deployable share one classpath.
    locations: classpath:db/migration/verification-service,classpath:db/outbox,classpath:db/app-config
    default-schema: verification
    baseline-on-migrate: true
    baseline-version: 1
server:
  port: ${SERVER_PORT:8084}

jihajoor:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  verification:
    # Shared service credential other services present on /internal/** (X-Internal-Api-Key),
    # i.e. the Provider Service's batch APPROVED lookup. Same INTERNAL_API_KEY as the other
    # services. No usable default: when unset every /internal/** request is refused (fail closed).
    internal-api-key: ${INTERNAL_API_KEY:}
    # Uploaded verification documents (Requirement 5.3). See DocumentStorage for the rules; the same
    # model as booking-service's media-storage, under this service's own prefix and DOCUMENTS_*
    # variables so nothing leaks to the other services sharing identity-app's JVM.
    document-storage:
      # Where new documents are written: 'auto' (S3 when a bucket is set and answers HeadBucket at
      # startup, else local disk with a WARN), 's3' (S3 or fail startup), or 'local' (always local).
      # Each document row records its store, so documents stay readable whichever mode runs.
      provider: ${DOCUMENT_STORAGE_PROVIDER:auto}
      local:
        # Root directory for locally stored documents. Instance-local unless it is a shared volume.
        directory: ${DOCUMENTS_LOCAL_DIR:${java.io.tmpdir}/jihajoor-documents}
      s3:
        # Blank = S3 not configured (Terraform output s3_bucket_documents in AWS).
        bucket: ${DOCUMENTS_BUCKET:}
        region: ${DOCUMENTS_S3_REGION:${AWS_REGION:}}
        # Optional key prefix inside the bucket, e.g. 'prod/'.
        prefix: ${DOCUMENTS_S3_PREFIX:}
        # S3-compatible store (MinIO, LocalStack), e.g. http://minio:9000; blank for AWS.
        endpoint: ${DOCUMENTS_S3_ENDPOINT:}
        path-style-access: ${DOCUMENTS_S3_PATH_STYLE_ACCESS:false}
        # Blank = the bucket's default encryption (SSE-KMS with the platform key on the Terraform
        # documents bucket); AES256 or aws:kms to request one per object.
        server-side-encryption: ${DOCUMENTS_S3_SSE:}
        kms-key-id: ${DOCUMENTS_S3_KMS_KEY_ID:}
        # Static keys, both or neither; otherwise the AWS SDK default chain (env, IRSA, instance role).
        access-key-id: ${DOCUMENTS_S3_ACCESS_KEY_ID:}
        secret-access-key: ${DOCUMENTS_S3_SECRET_ACCESS_KEY:}
        # Bound on the startup HeadBucket check.
        startup-check-timeout: ${DOCUMENTS_S3_STARTUP_CHECK_TIMEOUT:10s}
    required-document-types:
      - GOVERNMENT_ID
      - ADDRESS_PROOF
      - SKILL_CERTIFICATION
  provider:
    # Provider Service directory lookup (display name, primary skill) for the Admin review queue
    # (Requirement 19.3). Cosmetic: when unreachable or unauthorised the queue is still served,
    # without names.
    base-url: ${PROVIDER_SERVICE_URL:http://provider-service:8083}
    # Must match the Provider Service's jihajoor.provider.internal-api-key (the same INTERNAL_API_KEY).
    internal-api-key: ${INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: verification-service
