spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jihajoor}
    username: ${DB_USERNAME:jihajoor}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
    open-in-view: false
  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: auth
    # Unique per service: the services of a deployable share one classpath.
    locations: classpath:db/migration/auth-service,classpath:db/outbox,classpath:db/app-config
    default-schema: auth
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # SMTP server for EMAIL_PROVIDER=smtp (SmtpEmailSenderAdapter): Mailpit locally (port 1025, no
  # credentials, no TLS), the Amazon SES SMTP interface in AWS (email-smtp.<region>.amazonaws.com,
  # port 587, SES SMTP credentials, SMTP_STARTTLS=true). SMTP AUTH is switched on when a username
  # is set. Unused by the other providers: the mail sender only connects when an email is sent.
  # The variables are SMTP_* rather than SPRING_MAIL_*: services sharing a JVM share its
  # environment, and a SPRING_MAIL_HOST would configure mail (and a mail health check) in every
  # one of them.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8081}

jihajoor:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  auth:
    # Shared service credential other services present on /internal/** (X-Internal-Api-Key),
    # e.g. the Notification Service's contact lookup. Same INTERNAL_API_KEY the Booking Service
    # uses. Unset means every internal call is refused (fail closed); sign-in is unaffected, so
    # this deliberately does not stop the service from starting.
    internal-api-key: ${INTERNAL_API_KEY:}
    token:
      issuer: jihajoor-auth
      access-ttl: 15m
      refresh-ttl: 30d
    # One-off removal at startup (SCAN, idempotent) of refresh tokens that earlier versions stored
    # in clear as auth:refresh:{token}; tokens are now keyed by their SHA-256. Sessions holding a
    # pre-upgrade refresh token sign in again. Safe to turn off once every environment has run it.
    legacy-refresh-cleanup:
      enabled: ${LEGACY_REFRESH_CLEANUP_ENABLED:true}
    otp:
      ttl: 5m
      length: 6
      max-verify-attempts: 5
      lockout: 30m
      max-requests-per-window: 5
      rate-limit-window: 1h
      # TEMPORARY TEST MODE: every OTP is this code and no SMS is sent; staff accounts are
      # refused (they use username/password). Unset it once SMS delivery works.
      fixed-code: ${OTP_FIXED_CODE:}
    # Username/password sign-in. The lockout mirrors the OTP flow so both
    # authentication surfaces resist brute force identically (Requirement 1.3).
    password:
      max-attempts: 5
      lockout: 30m
      failure-window: 15m
    # Email sign-up, emailed codes, password reset and staff invitations (email-auth spec).
    email-auth:
      code-ttl: 10m
      max-code-attempts: 5
      resend-cooldown: 60s
      max-codes-per-email-per-hour: 5
      max-requests-per-ip-per-hour: ${EMAIL_AUTH_MAX_REQUESTS_PER_IP:10}
      pending-signup-ttl: 24h
      invitation-ttl: 7d
      # Where invitation links point: the Admin Portal's /invite/{token} page. Set by the
      # jihajoor.apps.admin-portal-url row of the config.app_config table (jihajoor-shared-config).
      admin-portal-url: ${jihajoor.apps.admin-portal-url:http://localhost:5175}
    # LOCAL DEV ONLY: create the documented test accounts at startup, each with a
    # console username and the supplied password. Off unless explicitly enabled, and
    # the password has no default so an enabled seeder must be given one.
    dev-seed:
      enabled: ${DEV_SEED_ENABLED:false}
      password: ${DEV_SEED_PASSWORD:}
    # First platform administrator of a fresh deployment (BootstrapAdminSeeder). Off unless a
    # username is set; only ever creates, never changes an existing account. Remove the
    # variables after the first sign-in.
    bootstrap-admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      mobile: ${BOOTSTRAP_ADMIN_MOBILE:}
    # Social login (Google, Apple) OIDC settings (Requirement 1.5, 23.10).
    # Audience is this platform's OAuth client / Services ID; injected from Secrets Manager.
    # Audience has no default: a blank audience would disable the ID-token 'aud' check.
    # A provider whose audience is unset is simply not offered (see SocialProviderConfiguredCondition).
    social:
      google:
        issuer: ${GOOGLE_ISSUER:https://accounts.google.com}
        audience: ${GOOGLE_CLIENT_ID}
        jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
      apple:
        issuer: ${APPLE_ISSUER:https://appleid.apple.com}
        audience: ${APPLE_SERVICES_ID}
        jwks-uri: ${APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}
  sms:
    # Selects the active SMS gateway adapter. Additional adapters can be added
    # behind SmsGatewayPort without touching the OTP flow.
    #   log  - record that a message would be sent (default)
    #   file - LOCAL DEV ONLY: append the message, including the code, to a file
    #   msg91 - MSG91 OTP API (India); needs the two msg91 settings below
    provider: ${SMS_PROVIDER:log}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      # MSG91 OTP template id, linked to the DLT-approved template whose text is
      # "Your Ji-Hajoor verification code is ##OTP##. It expires in 5 minutes."
      otp-template-id: ${MSG91_OTP_TEMPLATE_ID:}
    # Sink for the 'file' provider. Mounted to the host in the local compose file
    # so a developer can read the code without querying container logs.
    file-path: ${SMS_FILE_PATH:/var/log/jihajoor/dev-sms.log}
  email:
    # Selects the email adapter behind EmailSenderPort (email-auth Requirement 7).
    #   logging - record that an email was accepted, by subject only (default; delivers nothing)
    #   file    - LOCAL DEV ONLY: append whole emails, codes and links included, to a file
    #   smtp    - deliver over SMTP (spring.mail above): Mailpit locally, Amazon SES in AWS
    provider: ${EMAIL_PROVIDER:logging}
    file-path: ${EMAIL_FILE_PATH:/var/log/jihajoor/dev-mail.log}
    # From header of every email the smtp provider sends. With SES it must be a verified identity.
    from: "${EMAIL_FROM:Ji-Hajoor <no-reply@jihajoor.local>}"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Boot's mail health indicator opens an SMTP connection on every health check. Off: an email
    # outage must not mark the service down (sign-in works without email), and with any provider
    # but smtp there is no server to reach. MANAGEMENT_HEALTH_MAIL_ENABLED=true turns it on.
    mail:
      enabled: false
  metrics:
    tags:
      application: auth-service
