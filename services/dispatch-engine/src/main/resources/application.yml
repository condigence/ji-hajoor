spring:
  application:
    name: dispatch-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: dispatch
    open-in-view: false
  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: dispatch
    default-schema: dispatch
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: dispatch-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Reliability contract required by the shared KafkaProducerTemplate (Task 6).
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8087}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  dispatch:
    # Shared service credential presented on /internal/** (X-Internal-Api-Key): to the Booking
    # Service's transition endpoints, the Customer Service's address lookup and the Provider
    # Service's eligible-provider query. Must match the key each of those services expects.
    # Required: no default; the adapters fail fast at startup when it is absent.
    internal-api-key: ${INTERNAL_API_KEY}
    # Provider matching / offer / radius-expansion tuning (Requirements 8.2, 8.5, 8.8).
    initial-radius-km: ${DISPATCH_INITIAL_RADIUS_KM:10.0}
    radius-increment-km: ${DISPATCH_RADIUS_INCREMENT_KM:5.0}
    max-expansion-cycles: ${DISPATCH_MAX_EXPANSION_CYCLES:3}
    offer-timeout-seconds: ${DISPATCH_OFFER_TIMEOUT_SECONDS:60}
    # How often a waiting offer re-reads the provider's decision from Redis.
    offer-poll-interval-millis: ${DISPATCH_OFFER_POLL_INTERVAL_MILLIS:500}
    topics:
      booking-created: ${DISPATCH_TOPIC_BOOKING_CREATED:BookingCreated}
      # Cancellation stops an in-flight search and withdraws its pending offer.
      booking-cancelled: ${DISPATCH_TOPIC_BOOKING_CANCELLED:BookingCancelled}
    clients:
      provider-service-base-url: ${PROVIDER_SERVICE_URL:http://provider-service}
      booking-service-base-url: ${BOOKING_SERVICE_URL:http://booking-service}
      notification-service-base-url: ${NOTIFICATION_SERVICE_URL:http://notification-service}
      # Booking enrichment before matching (Requirement 8.2): addressId -> coordinates, and
      # subcategoryId -> required skill tags.
      customer-service-base-url: ${CUSTOMER_SERVICE_URL:http://customer-service}
      catalog-service-base-url: ${CATALOG_SERVICE_URL:http://catalog-service}
    bulkhead:
      # Dedicated, non-shared pools so scheduled load cannot starve emergency dispatch (Req 24.5).
      emergency-core-threads: ${DISPATCH_EMERGENCY_CORE_THREADS:8}
      emergency-max-threads: ${DISPATCH_EMERGENCY_MAX_THREADS:16}
      emergency-queue-capacity: ${DISPATCH_EMERGENCY_QUEUE_CAPACITY:100}
      scheduled-core-threads: ${DISPATCH_SCHEDULED_CORE_THREADS:8}
      scheduled-max-threads: ${DISPATCH_SCHEDULED_MAX_THREADS:16}
      scheduled-queue-capacity: ${DISPATCH_SCHEDULED_QUEUE_CAPACITY:500}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: dispatch-engine
