spring:
  application:
    name: customer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: customer
    open-in-view: false

  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: customer
    default-schema: customer
    baseline-on-migrate: true
    baseline-version: 1
server:
  port: ${SERVER_PORT:8082}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  customer:
    # Shared service credential other services present on /internal/** (X-Internal-Api-Key),
    # e.g. the Dispatch Engine's address lookup. Same INTERNAL_API_KEY the Booking Service uses.
    # No usable default: when unset every /internal/** request is refused (the rest of the
    # service still starts).
    internal-api-key: ${INTERNAL_API_KEY:}
    # Maximum saved addresses per customer (Requirement 2.3).
    max-addresses: 10
    # Data-deletion SLAs (Requirement 26.8, 26.9).
    deletion:
      acknowledge-within: 24h
      anonymize-within: 30d
  kms:
    # Selects the active KMS encryption adapter. Additional adapters can be added
    # behind KmsEncryptionPort without touching the profile/address logic.
    provider: ${KMS_PROVIDER:local}
    # Base64-encoded 256-bit data key used by the local AES adapter for dev/test.
    # In production the AWS KMS adapter is selected and this value is unused.
    # Required: no default, so the service fails fast when KMS_LOCAL_DATA_KEY is not set.
    local-data-key: ${KMS_LOCAL_DATA_KEY}
  geocoding:
    # Selects the active reverse-geocoding adapter (Maps API abstraction).
    provider: ${GEOCODING_PROVIDER:noop}
  booking:
    # Base URL of the Booking Service used to check active-booking references.
    base-url: ${BOOKING_SERVICE_URL:http://booking-service:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: customer-service
