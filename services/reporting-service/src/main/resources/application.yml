spring:
  application:
    name: reporting-service
  # This service owns no database; spring-jdbc only arrives transitively via the
  # shared libraries. Without these exclusions Boot tries to build a DataSource
  # and startup fails with "Failed to determine a suitable driver class".
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

server:
  port: ${SERVER_PORT:8096}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  # This service publishes no outbox events; the shared relay stays idle without a JPA repository.
  outbox:
    enabled: false
  reporting:
    # Inclusive-day threshold at or below which reports are generated synchronously
    # (Requirement 20.2, 20.3).
    synchronous-threshold-days: 7
    # Asynchronous download link lifetime (Requirement 20.3). ISO-8601 duration.
    download-link-ttl: 7d
    download-base-url: ${REPORT_DOWNLOAD_BASE_URL:https://reports.homefix.internal/download}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: reporting-service
