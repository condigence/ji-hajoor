spring:
  servlet:
    multipart:
      # Job photos and booking media: the service checks its own 50 MB limit (homefix.booking.media),
      # so the container must not refuse first at Spring's default 1 MB per file.
      max-file-size: 50MB
      max-request-size: 60MB
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: booking
    open-in-view: false

  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: booking
    default-schema: booking
    baseline-on-migrate: true
    baseline-version: 1
  # Consumes PaymentCompleted (Requirement 12.6). The producer side is only the shared DlqForwarder:
  # booking events still leave through the transactional outbox, not this template.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Reliability contract required by the shared KafkaProducerTemplate (Task 6).
      acks: all
      properties:
        enable.idempotence: true
server:
  port: ${SERVER_PORT:8085}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  booking:
    # Shared credential the Dispatch Engine presents on /internal/** (X-Internal-Api-Key).
    # Required: no default, so the service refuses internal calls rather than failing open.
    internal-api-key: ${INTERNAL_API_KEY}
    # Minimum lead time for a scheduled booking (Requirement 7.7).
    min-lead-time: 2h
    # Maximum scheduling horizon for a scheduled booking (Requirement 7.8).
    max-horizon: 90d
    # Emergency SLAs (Requirement 8.1): create within 2 s, reach SEARCHING_PROVIDER within
    # an additional 3 s (total 5 s). Used for internal timing assertions/metrics.
    emergency-create-within: 2s
    emergency-searching-within: 3s
    # Media upload limits (Requirement 7.2).
    media:
      max-files: 10
      max-file-size: 52428800   # 50 MB in bytes
      allowed-content-types: image/jpeg,image/png,video/mp4,video/quicktime
    # Additional-quote customer response window before auto-completion (Requirement 9.9).
    additional-quote-timeout: 60m
    # Default cancellation fee applied when a Service_Subcategory has none configured
    # (Requirement 9.18 range 0.00-999.99).
    default-cancellation-fee: 0.00
    # Provider Service, owner of the Tenant registry (multi-tenant design D1). booking-service asks
    # its /internal/tenants/** endpoints with the internal-api-key above (Requirement MT-10.5).
    provider-service-url: ${PROVIDER_SERVICE_URL:http://provider-service:8083}
    # TenantDirectoryPort adapter: 'http' (default, production) or 'stub' (knows no Tenants, so a
    # booking nobody accepts fails as before the Tenant feature).
    tenant-directory-client: ${TENANT_DIRECTORY_CLIENT:http}
    # How long a booking may wait for a Tenant assignment before it fails (Requirement MT-7.1).
    tenant-assignment-timeout: ${TENANT_ASSIGNMENT_TIMEOUT:PT60M}
    topics:
      # Settles a paid booking at PAYMENT_COMPLETED (Requirement 12.6).
      payment-completed: ${BOOKING_TOPIC_PAYMENT_COMPLETED:PaymentCompleted}
  catalog:
    # Selects the active CatalogClientPort adapter: 'http' (production) or 'stub' (dev/test).
    client: ${CATALOG_CLIENT:stub}
    base-url: ${CATALOG_SERVICE_URL:http://catalog-service:8085}
  customer:
    # Selects the active CustomerAddressPort adapter: 'http' (production) or 'stub' (dev/test).
    # Resolves a booking's saved address for the provider's job screen (Requirement 11.1).
    client: ${CUSTOMER_CLIENT:stub}
    base-url: ${CUSTOMER_SERVICE_URL:http://customer-service:8082}
  pricing:
    # Selects the active PricingClientPort adapter: 'http' (production) or 'stub' (dev/test).
    client: ${PRICING_CLIENT:stub}
    base-url: ${PRICING_ENGINE_URL:http://pricing-engine:8086}
    # Timezone the Pricing Engine evaluates night/weekend surcharge windows in; must match its
    # own homefix.pricing.zone-id (Requirement 6.5, 6.6).
    zone: ${PRICING_ZONE:UTC}
  media-storage:
    # Selects the active MediaStoragePort adapter: 's3' (production) or 'local' (dev/test).
    provider: ${MEDIA_STORAGE_PROVIDER:local}
    bucket: ${MEDIA_BUCKET:homefix-media}
  outbox:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: booking-service
