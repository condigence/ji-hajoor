spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment
    open-in-view: false
  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: payment
    default-schema: payment
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8088}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  payment:
    # Customer retry attempts before a transaction is permanently FAILED (Requirement 12.8).
    max-customer-retries: 3
    # Retries for PaymentCompleted publish / invoice trigger before CRITICAL log (Requirement 12.6).
    max-invoice-retries: 3
    # Retries for provider wallet credit before alerting Finance_Admin (Requirement 12.11).
    max-wallet-credit-retries: 3
    # Base backoff, doubled between attempts.
    retry-backoff: 1s
    # Default platform fee percentage when none is supplied (Requirement 12.10).
    default-platform-fee-percent: 20.00
    # TTL of the idempotency key entry, covering the payment window (Requirement 12.3).
    idempotency-ttl: 24h
    # Idempotency store backend: 'redis' (production) or 'memory' (dev/test).
    idempotency-store: ${PAYMENT_IDEMPOTENCY_STORE:redis}
    # Oldest signed gateway-callback timestamp accepted (Requirement 12.5); 0 disables the check.
    callback-max-age: 72h
    # Owed provider wallet credits (Requirement 12.10, 12.11): a credit not confirmed after the
    # SUCCESS commit is re-sent by WalletCreditSweeper once it is at least min-age old (keep this
    # well above the in-line retry window), checked every sweep-interval (ISO-8601 duration).
    wallet-credit-sweep-min-age: 5m
    wallet-credit-sweep-interval: PT1M
    # Gateway used when POST /payments names none. Compose sets 'simulator' (local only).
    default-gateway: ${PAYMENT_DEFAULT_GATEWAY:razorpay}
    # Payment attempts per (customer, booking); a new attempt opens only after the last FAILED.
    max-payment-attempts: 10
    # A PENDING attempt younger than this may still be captured, so the retries endpoint refuses
    # to fail it (409 PAYMENT_IN_FLIGHT); 0 disables the guard.
    pending-charge-timeout: 30m
    # Booking payments are priced from the Booking Service's internal payment-facts endpoint and
    # move the booking to PAYMENT_PENDING through it, presenting the shared service credential.
    booking-service-url: ${BOOKING_SERVICE_URL:http://booking-service:8084}
    # Where a paid booking's earning is credited (POST /internal/providers/{id}/earnings).
    provider-service-url: ${PROVIDER_SERVICE_URL:http://provider-service:8083}
    provider-wallet:
      # 'http' credits the Provider Service wallet; 'logging' (the default, for tests and running
      # without a Provider Service) only logs the intent and pays no one.
      client: ${PROVIDER_WALLET_CLIENT:logging}
    internal-api-key: ${INTERNAL_API_KEY:}
    gateways:
      razorpay:
        # API key pair from Razorpay Dashboard > Account & Settings > API Keys (rzp_test_... for
        # test mode). Without both, the 'razorpay' gateway refuses new payments with 503.
        key-id: ${RAZORPAY_KEY_ID:}
        key-secret: ${RAZORPAY_KEY_SECRET:}
        # Razorpay webhook signing secret (HMAC-SHA256). From AWS Secrets Manager in production.
        # Required: no default, so the service fails fast when RAZORPAY_WEBHOOK_SECRET is not set.
        webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
        api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
      stripe:
        # Stripe webhook signing secret (HMAC-SHA256). From AWS Secrets Manager in production.
        # Required: no default, so the service fails fast when STRIPE_WEBHOOK_SECRET is not set.
        webhook-secret: ${STRIPE_WEBHOOK_SECRET}
      simulator:
        # LOCAL ONLY. Registers the 'simulator' gateway, which settles every charge as SUCCESS
        # through a self-signed callback without moving money. Off unless explicitly enabled;
        # never enabled in Helm. A WARN is logged at startup whenever it is on.
        enabled: ${PAYMENT_SIMULATOR_ENABLED:false}
        # Signs the simulator's callbacks; a built-in dev secret is used when empty (only read
        # when the simulator is enabled).
        secret: ${PAYMENT_SIMULATOR_SECRET:}
  kms:
    # Selects the active KMS encryption adapter behind KmsEncryptionPort.
    # 'local' uses an AES-GCM adapter with a configured data key (dev/test); in production an
    # AWS KMS adapter can be added behind the same port without touching business logic.
    provider: ${KMS_PROVIDER:local}
    # Base64-encoded 256-bit data key used by the local AES-GCM adapter (dev/test only).
    # Required: no default, so the service fails fast when KMS_DATA_KEY is not set.
    data-key: ${KMS_DATA_KEY}
  outbox:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: payment-service
