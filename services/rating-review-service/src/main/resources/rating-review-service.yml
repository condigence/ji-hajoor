spring:
  application:
    name: rating-review-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jihajoor}
    username: ${DB_USERNAME:jihajoor}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: rating
    open-in-view: false
  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: rating
    # Unique per service: the services of a deployable share one classpath.
    locations: classpath:db/migration/rating-review-service,classpath:db/outbox,classpath:db/app-config
    default-schema: rating
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: rating-review-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Reliability contract required by the shared KafkaProducerTemplate (Task 6).
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8090}

jihajoor:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  rating:
    # Review prompt open window from PAYMENT_COMPLETED (Requirement 15.1, 15.2, Property 15).
    review-window: ${RATING_REVIEW_WINDOW:7d}
    # Reviews within this window get the higher weight in the aggregate (Requirement 15.4).
    recent-window: ${RATING_RECENT_WINDOW:90d}
    # Weight multipliers for the weighted aggregate (Requirement 15.4, Property 16).
    recent-weight: ${RATING_RECENT_WEIGHT:1.5}
    older-weight: ${RATING_OLDER_WEIGHT:1.0}
    # Aggregate below this threshold auto-flags the provider UNDER_REVIEW (Requirement 15.7, 15.8).
    # Used only by the 'logging' provider-rating client below; with 'http' the Provider Service
    # applies its own jihajoor.provider.review-rating-threshold. Set REVIEW_RATING_THRESHOLD (read
    # by both services) rather than either service's own variable, so the two cannot drift.
    under-review-threshold: ${REVIEW_RATING_THRESHOLD:${RATING_UNDER_REVIEW_THRESHOLD:3.0}}
    # Where each provider's aggregate rating is set after a review change
    # (PUT /internal/providers/{id}/rating). Must reach the Provider Service; in a combined
    # deployable that is identity-app:8083.
    provider-service-url: ${PROVIDER_SERVICE_URL:http://provider-service:8083}
    # Shared service credential presented as X-Internal-Api-Key; must match the Provider Service's
    # jihajoor.provider.internal-api-key. When unset every rating update is refused and stays owed.
    internal-api-key: ${INTERNAL_API_KEY:}
    provider-rating:
      # 'http' (the default) sets ratings in the Provider Service; 'logging' only logs them and
      # keeps the UNDER_REVIEW flag in memory, for running without a Provider Service.
      client: ${PROVIDER_RATING_CLIENT:http}
    provider-sync:
      # A rating the Provider Service did not confirm right after the review commit stays owed and
      # is re-sent by ProviderRatingSweeper every sweep-interval (ISO-8601), once its change is at
      # least sweep-min-age old, at most sweep-batch-size per run (oldest first).
      sweep-interval: ${RATING_PROVIDER_SYNC_SWEEP_INTERVAL:PT1M}
      sweep-min-age: ${RATING_PROVIDER_SYNC_SWEEP_MIN_AGE:1m}
      sweep-batch-size: ${RATING_PROVIDER_SYNC_SWEEP_BATCH_SIZE:100}
    # Text review maximum length (Requirement 15.3).
    max-review-text-length: ${RATING_MAX_TEXT_LENGTH:1000}
    fraud:
      # Same-IP burst: >= this many reviews within the window flags (Requirement 15.5a).
      same-ip-threshold: ${RATING_FRAUD_SAME_IP_THRESHOLD:2}
      same-ip-window: ${RATING_FRAUD_SAME_IP_WINDOW:1h}
      # Star rating deviation above this many SD from provider mean flags (Requirement 15.5b).
      deviation-sd-threshold: ${RATING_FRAUD_DEVIATION_SD:2.0}
      # Accounts younger than this at submission flag the review (Requirement 15.5c).
      min-account-age: ${RATING_FRAUD_MIN_ACCOUNT_AGE:24h}
    attachments:
      # Photo attachment limits (Requirement 15.3).
      max-count: ${RATING_MAX_ATTACHMENTS:5}
      max-bytes: ${RATING_MAX_ATTACHMENT_BYTES:10485760}
    topics:
      payment-completed: ${RATING_TOPIC_PAYMENT_COMPLETED:PaymentCompleted}
      review-submitted: ${RATING_TOPIC_REVIEW_SUBMITTED:ReviewSubmitted}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: rating-review-service
