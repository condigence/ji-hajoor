spring:
  application:
    name: complaint-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jihajoor}
    username: ${DB_USERNAME:jihajoor}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: complaint
    open-in-view: false
  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: complaint
    # Unique per service: the services of a deployable share one classpath.
    locations: classpath:db/migration/complaint-service,classpath:db/outbox,classpath:db/app-config
    default-schema: complaint
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: complaint-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Reliability contract required by the shared KafkaProducerTemplate (Task 6).
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8091}

jihajoor:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  complaint:
    # Description maximum length (Requirement 16.1).
    max-description-length: ${COMPLAINT_MAX_DESCRIPTION_LENGTH:2000}
    # Customer acknowledgment SLA from submission (Requirement 16.2).
    acknowledgment-sla: ${COMPLAINT_ACKNOWLEDGMENT_SLA:30m}
    # In-app status-change notification SLA (Requirement 16.3).
    status-change-notification-sla: ${COMPLAINT_STATUS_CHANGE_SLA:5m}
    # Resolution SLA by service priority (Requirement 16.4).
    emergency-resolution-sla: ${COMPLAINT_EMERGENCY_SLA:24h}
    standard-resolution-sla: ${COMPLAINT_STANDARD_SLA:72h}
    # Stats aggregation refresh window for Admin reports (Requirement 16.9).
    stats-refresh-window: ${COMPLAINT_STATS_REFRESH_WINDOW:60m}
    # A refund call with no recorded outcome counts as in flight this long: a same-key retry is 409
    # REFUND_IN_PROGRESS until then, and re-sends the refund (same idempotency key) after. Keep it
    # well above payment.connect-timeout + payment.read-timeout.
    refund-attempt-lease: ${COMPLAINT_REFUND_ATTEMPT_LEASE:5m}
    # Approved refunds move money through the Payment Service's service-to-service
    # POST /internal/payments/refunds (Requirement 16.5).
    payment:
      # 'http' (default) refunds through the Payment Service. 'logging' is LOCAL/DEV ONLY: it records
      # every refund SUCCEEDED and moves no money.
      client: ${COMPLAINT_PAYMENT_CLIENT:http}
      base-url: ${PAYMENT_SERVICE_URL:http://payment-service:8088}
      # Shared service credential sent as X-Internal-Api-Key; the Payment Service checks the same
      # INTERNAL_API_KEY. No usable default: when unset, no refund is sent and every approval answers
      # 502 REFUND_OUTCOME_UNKNOWN (the refund stays PENDING and can be re-sent once it is set).
      internal-api-key: ${INTERNAL_API_KEY:}
      connect-timeout: ${COMPLAINT_PAYMENT_CONNECT_TIMEOUT:2s}
      # Generous: the Payment Service answers only after the gateway does. A call cut short here
      # leaves the refund PENDING with an unknown outcome.
      read-timeout: ${COMPLAINT_PAYMENT_READ_TIMEOUT:60s}
    attachments:
      # Evidence attachment limits (Requirement 16.1).
      max-count: ${COMPLAINT_MAX_ATTACHMENTS:5}
      max-bytes: ${COMPLAINT_MAX_ATTACHMENT_BYTES:10485760}
    topics:
      complaint-created: ${COMPLAINT_TOPIC_COMPLAINT_CREATED:ComplaintCreated}
      complaint-status-changed: ${COMPLAINT_TOPIC_COMPLAINT_STATUS_CHANGED:ComplaintStatusChanged}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: complaint-service
