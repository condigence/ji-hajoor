spring:
  application:
    name: admin-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: admin
    open-in-view: false

  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: admin
    default-schema: admin
    baseline-on-migrate: true
    baseline-version: 1
server:
  port: ${SERVER_PORT:8095}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  admin:
    # Dashboard metric refresh cadence (Requirement 19.1). Must be an ISO-8601
    # duration: it feeds @Scheduled(fixedRateString), which parses ISO-8601 or a
    # plain millisecond count and rejects Boot's relaxed "60s" form.
    dashboard-refresh-interval: PT60S

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: admin-service
