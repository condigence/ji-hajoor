spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
    open-in-view: false
  # Schema migrations own the DDL; Hibernate only validates against it. V1 is the baseline
  # schema, so on a database Hibernate already populated (ddl-auto=update, the old local default)
  # Flyway records V1 as applied instead of re-creating tables that exist.
  flyway:
    schemas: catalog
    default-schema: catalog
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8085}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  catalog:
    # Selects the active CatalogCachePort adapter: 'redis' (production) or 'memory' (dev/test).
    # Both enforce the same 300-second read-through TTL (Requirement 3.8).
    cache: ${CATALOG_CACHE:memory}
    min-base-price: 0.01
    max-base-price: 999999.99
    min-duration-minutes: 1
    max-duration-minutes: 480
    max-skill-tags: 20
    # ISO-8601 duration; 300 seconds satisfies the Requirement 3.8 freshness bound.
    cache-ttl: 300s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  # Do not fail readiness on Redis in the in-memory cache profile.
  health:
    redis:
      enabled: ${CATALOG_REDIS_HEALTH:false}
  metrics:
    tags:
      application: catalog-service
