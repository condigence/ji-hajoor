# Fluent Bit Helm values — CloudWatch log forwarding from EKS pods
# Chart: fluent/fluent-bit
# Version: >= 0.43.x
# Deploy: helm upgrade --install fluent-bit fluent/fluent-bit \
#           -n logging --create-namespace -f fluent-bit-values.yaml

image:
  repository: public.ecr.aws/aws-observability/aws-for-fluent-bit
  tag: "2.32.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations:
    # IRSA annotation — replace ACCOUNT_ID and OIDC_ID with real values
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/jihajoor-fluent-bit"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

config:
  service: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  filters: |
    # Enrich with Kubernetes metadata
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # Parse structured JSON application logs
    [FILTER]
        Name    parser
        Match   kube.*
        Key_Name log
        Parser  json_log
        Reserve_Data True

    # Add cluster metadata
    [FILTER]
        Name    record_modifier
        Match   kube.*
        Record  cluster_name jihajoor-eks
        Record  environment production

    # Suppress health-check noise
    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log .*health.*

  outputs: |
    # One CloudWatch log group per deployable, matched by container name. The tag is
    # kube.var.log.containers.<pod>_<namespace>_<container>-<id>.log and the Helm chart names
    # each container after its deployable, so this works in whichever namespace the deploy
    # pipeline uses (K8S_NAMESPACE per GitHub environment).
    [OUTPUT]
        Name               cloudwatch_logs
        Match              kube.*_*_api-gateway-*
        region             ap-south-1
        log_group_name     /jihajoor/eks/api-gateway
        log_stream_prefix  ${HOSTNAME}-
        auto_create_group  true
        log_retention_days 90
        log_key            log_processed

    [OUTPUT]
        Name               cloudwatch_logs
        Match              kube.*_*_identity-app-*
        region             ap-south-1
        log_group_name     /jihajoor/eks/identity-app
        log_stream_prefix  ${HOSTNAME}-
        auto_create_group  true
        log_retention_days 90
        log_key            log_processed

    [OUTPUT]
        Name               cloudwatch_logs
        Match              kube.*_*_jobs-app-*
        region             ap-south-1
        log_group_name     /jihajoor/eks/jobs-app
        log_stream_prefix  ${HOSTNAME}-
        auto_create_group  true
        log_retention_days 90
        log_key            log_processed

    [OUTPUT]
        Name               cloudwatch_logs
        Match              kube.*_*_money-app-*
        region             ap-south-1
        log_group_name     /jihajoor/eks/money-app
        log_stream_prefix  ${HOSTNAME}-
        auto_create_group  true
        log_retention_days 90
        log_key            log_processed

    [OUTPUT]
        Name               cloudwatch_logs
        Match              kube.*_*_engagement-app-*
        region             ap-south-1
        log_group_name     /jihajoor/eks/engagement-app
        log_stream_prefix  ${HOSTNAME}-
        auto_create_group  true
        log_retention_days 90
        log_key            log_processed

    # -------------------------------------------------------------------------
    # Catch-all: remaining system pods → /jihajoor/eks/system
    # -------------------------------------------------------------------------
    [OUTPUT]
        Name               cloudwatch_logs
        Match              kube.*
        region             ap-south-1
        log_group_name     /jihajoor/eks/system
        log_stream_prefix  ${HOSTNAME}-
        auto_create_group  true
        log_retention_days 30
        log_key            log_processed

  customParsers: |
    [PARSER]
        Name        json_log
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ

    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

daemonset:
  enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2020"
    prometheus.io/path: "/api/v1/metrics/prometheus"
