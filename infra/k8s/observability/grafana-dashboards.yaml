# Grafana dashboards delivered as ConfigMaps.
# The kube-prometheus-stack Grafana sidecar auto-imports any ConfigMap carrying
# the label grafana_dashboard="1" (see prometheus-values.yaml -> grafana.sidecar.dashboards).
#
# Deploy: kubectl apply -f grafana-dashboards.yaml
#
# Two dashboards are provided:
#   1. homefix-platform-overview  — request rate, error rate, p50/p95/p99 latency,
#                                    DB connection pool, cache hit rate
#   2. homefix-events-and-funnel  — Kafka consumer lag + booking funnel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: homefix
data:
  platform-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "schemaVersion": 39,
      "title": "HomeFix — Platform Overview",
      "uid": "homefix-platform-overview",
      "tags": ["homefix", "slo"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(http_server_requests_seconds_count, namespace)",
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "service",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(http_server_requests_seconds_count{namespace=~\"$namespace\"}, service)",
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{namespace=~\"$namespace\", service=~\"$service\"}[5m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error Rate (% 5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "unit": "percentunit", "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.01 } ] } } },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{namespace=~\"$namespace\", service=~\"$service\", status=~\"5..\"}[5m])) / clamp_min(sum by (service) (rate(http_server_requests_seconds_count{namespace=~\"$namespace\", service=~\"$service\"}[5m])), 1)",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latency p50 / p95 / p99 (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=~\"$namespace\", service=~\"$service\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=~\"$namespace\", service=~\"$service\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=~\"$namespace\", service=~\"$service\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 4,
          "title": "DB Connection Pool (active / max)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (service) (hikaricp_connections_active{namespace=~\"$namespace\", service=~\"$service\"})",
              "legendFormat": "{{service}} active"
            },
            {
              "expr": "sum by (service) (hikaricp_connections_max{namespace=~\"$namespace\", service=~\"$service\"})",
              "legendFormat": "{{service}} max"
            }
          ]
        },
        {
          "id": 5,
          "title": "Redis Cache Hit Ratio",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "green", "value": 0.9 } ] } } },
          "targets": [
            {
              "expr": "rate(redis_keyspace_hits_total[5m]) / clamp_min(rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]), 1)",
              "legendFormat": "hit ratio"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-events-and-funnel
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: homefix
data:
  events-and-funnel.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "schemaVersion": 39,
      "title": "HomeFix — Events & Booking Funnel",
      "uid": "homefix-events-funnel",
      "tags": ["homefix", "kafka", "funnel"],
      "time": { "from": "now-24h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Kafka Consumer Lag by Group",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1000 }, { "color": "red", "value": 10000 } ] } } },
          "targets": [
            {
              "expr": "sum by (consumergroup) (kafka_consumergroup_lag)",
              "legendFormat": "{{consumergroup}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Booking Funnel (created \u2192 searching \u2192 accepted \u2192 completed)",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 9 },
          "datasource": "Prometheus",
          "description": "Counters emitted by booking-service via Micrometer. Metric name: homefix_booking_transitions_total{to_state=...}",
          "targets": [
            {
              "expr": "sum(increase(homefix_booking_transitions_total{to_state=\"SEARCHING_PROVIDER\"}[1h]))",
              "legendFormat": "searching"
            },
            {
              "expr": "sum(increase(homefix_booking_transitions_total{to_state=\"PROVIDER_ACCEPTED\"}[1h]))",
              "legendFormat": "accepted"
            },
            {
              "expr": "sum(increase(homefix_booking_transitions_total{to_state=\"JOB_COMPLETED\"}[1h]))",
              "legendFormat": "completed"
            },
            {
              "expr": "sum(increase(homefix_booking_transitions_total{to_state=\"SEARCHING_FAILED\"}[1h]))",
              "legendFormat": "searching failed"
            }
          ]
        },
        {
          "id": 3,
          "title": "DLQ Message Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 18 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (topic) (rate(kafka_topic_partition_current_offset{topic=~\".*\\\\.DLQ|.*-dlq|.*dead-letter.*\"}[5m]))",
              "legendFormat": "{{topic}}"
            }
          ]
        }
      ]
    }
